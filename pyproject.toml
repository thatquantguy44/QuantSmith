[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantsmith"
version = "0.1.0"
description = "Spec-driven, agentic SDK for reproducible quantitative research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
quant = [
  "scipy>=1.10",
]
data = [
  "pandas>=2.0",
  "pandas-datareader>=0.10",
]
investigator = [
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=14",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]
dev = [
  "pytest>=8.0",
  "openpyxl>=3.1",
  "coverage>=7.4",
]

[project.scripts]
quantsmith-knowledge-console = "quantsmith.knowledge_console.__main__:main"
quantsmith-memory = "quantsmith.pipelines.workflow_memory_cli:main"
quantsmith-agentic-quant = "quantsmith.quant.agentic_quant.main:main"
quantsmith-orchestration = "quantsmith.orchestration.replay_cli:main"
quantsmith-text-intelligence = "quantsmith.text_intelligence.cli:main"
quantsmith-sec-lending = "quantsmith.quant.agentic_quant.cli.sec_lending:main"
quantsmith-rebalancer = "quantsmith.quant.agentic_quant.cli.rebalancer:main"
quantsmith-sp500 = "quantsmith.quant.agentic_quant.cli.sp500:main"
quantsmith-nl-analytics = "quantsmith.nl_analytics.cli:main"
quantsmith-dataset-investigator = "quantsmith.dataset_investigator.cli:main"
quantsmith-test-engineering = "quantsmith.test_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quantsmith.asian_nlp" = ["fixtures/*.json"]
