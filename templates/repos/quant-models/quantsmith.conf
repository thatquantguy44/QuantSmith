# Repo shape: quant-models
# Production model development. Something here will size a real position, so
# the backtest is the artifact under governance, not the notebook.

QF_REPO_SHAPE="quant-models"
QF_CONFORMANCE_LEVEL=3

QF_DOC_ROADMAP="docs/roadmap.md"
QF_DOC_NARRATIVE="README.md docs/roadmap.md docs/architecture.md docs/conformance.md"

QF_CATALOG_1="specs|specs/README.md|specs|spec.md|badge/Specs-[0-9]+"
QF_CATALOG_2="models|models/README.md|models|model_card.md|[0-9]+ models"
QF_CATALOG_3="backtests|backtests/README.md|backtests|backtest_report.md|[0-9]+ backtests"

# backtest and leakage BLOCK. A look-ahead bug here is not a bad report, it is
# a bad trade. repro blocks too: a result nobody can reproduce is not a result.
QF_GATES_BLOCKING="ownership secret-scan spec spec-index backtest leakage handoff-sync docs-link agent-attribution"
QF_GATES_ADVISORY="upstream-drift doc-counts repro data-contract data-provenance monitoring-coverage readme-sync"

# repro is advisory ONLY until this repo has its first recorded run: a fresh
# repo has no run manifest because nothing has run yet, and blocking day-one CI
# on that teaches people to bypass gates. Promote it to blocking the moment
# your first backtest lands -- from then on, an unrecorded run IS a finding.

# --- Upstream pin -----------------------------------------------------------
# Adoption is copy-and-own, so these surfaces WILL diverge as you tune them.
# That is expected. The pin makes divergence visible rather than silent: the
# `upstream-drift` gate reports what differs from this ref, and
# ./scripts/sync-upstream.sh either refreshes the copies or moves the pin.
# Record deliberate divergence in docs/ownership.md so the report stays readable.
QF_UPSTREAM_REPO="https://github.com/joshualutkemuller/QuantSmith.git"
QF_UPSTREAM_REF="v0.1.0"
QF_UPSTREAM_SURFACES="hooks/stages instructions templates/spec templates/docs"

# --- Usage telemetry --------------------------------------------------------
# Uncomment to record which gates actually fire. Local, gitignored, and carries
# only timestamp/gate/finding-count -- never paths, finding text, or identity.
#   ./scripts/usage-report.sh
# QF_USAGE_LOG=".qf-usage.tsv"
