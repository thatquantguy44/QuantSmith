# Repo shape: quant-research
# Exploratory. Optimized for many cheap experiments that mostly fail, with
# enough discipline that the ones that work can be reproduced and promoted.

QF_REPO_SHAPE="quant-research"
QF_CONFORMANCE_LEVEL=2

QF_DOC_ROADMAP="docs/roadmap.md"
QF_DOC_NARRATIVE="README.md docs/roadmap.md docs/architecture.md"

# name | index doc | entity root | entity marker | count patterns (;-separated)
QF_CATALOG_1="specs|specs/README.md|specs|spec.md|badge/Specs-[0-9]+"
QF_CATALOG_2="experiments|experiments/README.md|experiments|run_card.md|[0-9]+ experiments"
QF_CATALOG_3="sources|sources/README.md|sources|.yml|[0-9]+ data sources"

# Leakage and provenance block, because a research repo's failure mode is a
# result that was never real. The spec chain is advisory here: a spec per
# experiment would stop people running experiments.
QF_GATES_BLOCKING="ownership secret-scan docs-link handoff-sync"
QF_GATES_ADVISORY="upstream-drift leakage repro data-provenance spec spec-index doc-counts data-contract"

# --- Upstream pin -----------------------------------------------------------
# Adoption is copy-and-own, so these surfaces WILL diverge as you tune them.
# That is expected. The pin makes divergence visible rather than silent: the
# `upstream-drift` gate reports what differs from this ref, and
# ./scripts/sync-upstream.sh either refreshes the copies or moves the pin.
# Record deliberate divergence in docs/ownership.md so the report stays readable.
QF_UPSTREAM_REPO="https://github.com/joshualutkemuller/QuantSmith.git"
QF_UPSTREAM_REF="v0.1.0"
QF_UPSTREAM_SURFACES="hooks/stages instructions templates/spec templates/docs"

# --- Usage telemetry --------------------------------------------------------
# Uncomment to record which gates actually fire. Local, gitignored, and carries
# only timestamp/gate/finding-count -- never paths, finding text, or identity.
#   ./scripts/usage-report.sh
# QF_USAGE_LOG=".qf-usage.tsv"
