# Agent registry -- GENERATED by scripts/build_agent_registry.py. Do not edit by hand.
#
# One entry per public agent (a directory under agents/ containing prompt.md). Regenerate
# after adding or changing an agent:   python3 scripts/build_agent_registry.py
# The test suite and the agent-catalog gate fail when this file is stale or incomplete.
# Strings are JSON scalars (valid YAML). `interface` keeps the machine identifiers the six
# original entries carried. See agents/README.md for the human-readable catalog.
agents:
  - name: "alerts/alert_policy"
    category: "alerts"
    purpose: "The Alert Policy Agent decides *when* to alert."
    path: "agents/alerts/alert_policy/"
    inputs:
      - "Monitoring observations (from `0019`/`0021`) and the metric to guard."
      - "The condition (threshold `max`/`min`, missing), severity, and any suppression window."
    outputs:
      - "`AlertPolicy` definitions and the alerts they fire (`evaluate_policies`)."
      - "A rationale for the threshold/severity and the expected alert rate."
      - "Handoffs to `alert_router` and `alerts/incident_notification`."
  - name: "alerts/alert_router"
    category: "alerts"
    purpose: "The Alert Router Agent decides how an alert reaches a human: ownership, deduplication, grouping, rate limits, trading-hours rules, escalation paths, and delivery-channel selection."
    path: "agents/alerts/alert_router/"
    inputs:
      - "Alerts from `alert_policy` (`evaluate_policies`, spec `0020`)."
      - "Ownership map, severity->channel map, suppression set, and escalation threshold."
    outputs:
      - "`RoutedAlert` payloads (owner, channel, escalated, dedup count) via `route`."
      - "Delivery through the `adapters/alert_delivery/` providers."
      - "Handoffs to `adapters/alert_delivery/` and `alerts/incident_notification`."
  - name: "alerts/incident_notification"
    category: "alerts"
    purpose: "The Incident Notification Agent produces actionable notification payloads and owns the alert lifecycle: acknowledgement, escalation, recovery notices, and links to runbooks and evidence."
    path: "agents/alerts/incident_notification/"
    inputs:
      - "Routed alerts from `alert_router` and `adapters/alert_delivery/` results."
      - "Runbook and dashboard links, owner, and correlation IDs."
    outputs:
      - "Actionable notification payloads (what broke, impact, owner, evidence, runbook)."
      - "Lifecycle state: triggered -> acknowledged -> resolved -> closed, plus recovery."
      - "Handoffs to `maintenance_monitoring` and `knowledge/institutional_memory`."
  - name: "analytics/dashboard_design"
    category: "analytics"
    purpose: "The Dashboard Design Agent designs dashboards for comprehension, independent of any one BI tool."
    path: "agents/analytics/dashboard_design/"
    inputs:
      - "Governed metric definitions (`0008`) and the analytics `Report` (`0010`)."
      - "The audience, the key questions the dashboard must answer, and the target tool(s)."
      - "Any narrative from `data_storytelling` to structure around."
    outputs:
      - "A tool-agnostic dashboard spec: panels (chart type, encodings, metric refs), information hierarchy, drill paths, filters, and accessibility notes."
      - "A handoff to the tool-specific dashboard agents to render the payload."
      - "Notes on chart-type fit and any accessibility/perception risks."
  - name: "analytics/data_storytelling"
    category: "analytics"
    purpose: "The Data Storytelling Agent turns a governed analysis into a narrative a stakeholder can act on."
    path: "agents/analytics/data_storytelling/"
    inputs:
      - "A governed `Report` from the analytics pipeline (`0010`): metric, value, provenance."
      - "The metric definition (`0008`) and any experiment readout (`0009`)."
      - "The audience, the decision at stake, and the desired length/format."
    outputs:
      - "A narrative: audience, key message (one line), the insight, the recommended action, and the caveats/limitations."
      - "The supporting provenance (source, period, definitions) carried from the `Report`."
      - "A handoff to `reporting-agent` (artifact) and/or `dashboard_design` (visual story)."
  - name: "analytics/data_visualization"
    category: "analytics"
    purpose: "The Data Visualization Agent owns single-chart encoding: chart-type choice, axis and series encoding, color, sorting, units/labels, and accessibility for one chart at a time."
    path: "agents/analytics/data_visualization/"
    inputs:
      - "A computed metric result: value(s), declared dimensions, and/or a per-period series — already governed by `0008`; never raw rows or a SQL query."
      - "The question or intent behind the chart (what it must answer)."
      - "Units, and whether a comparison (delta, prior-period, or a second metric for a scatter) is present."
    outputs:
      - "A chart-type decision (kpi / bar / line / scatter / table) with the rule that produced it."
      - "Encodings: axes, series, sort order, zero-baseline decision, units/labels."
      - "A finding-first title, a footnote for anything caveated, and alt text."
      - "A minimal Vega-Lite spec and a Markdown table rendering of the same chart."
  - name: "analytics/experimentation"
    category: "analytics"
    purpose: "The Experimentation Agent designs and reads out controlled experiments (A/B tests) with statistical discipline."
    path: "agents/analytics/experimentation/"
    inputs:
      - "The decision and the metric (a conversion/proportion for this slice)."
      - "The pre-registered design: baseline rate, minimum detectable effect, significance level, power, and expected allocation."
      - "Per-arm results: subjects and conversions for control and treatment."
    outputs:
      - "A required per-arm sample size for the design."
      - "A result readout: difference, lift, p-value, confidence interval, and significance."
      - "A validity assessment: sample-ratio mismatch and achieved power."
      - "A verdict (`treatment` / `control` / `no_difference` / `inconclusive`) with explicit caveats."
  - name: "analytics/metrics_semantic_layer"
    category: "analytics"
    purpose: "The Metrics Semantic Layer Agent owns the canonical definitions of an organization's metrics — the single source of truth for what \"revenue\", \"conversion rate\", \"active users\", or any KPI means."
    path: "agents/analytics/metrics_semantic_layer/"
    inputs:
      - "The business question and the metric(s) it needs."
      - "The available fact grain, dimensions, and base measures (from `sql-integration-agent` / `data-prep-agent`)."
      - "Any existing or conflicting definitions to reconcile."
      - "The metric owner and the required time grain."
    outputs:
      - "A canonical metric definition (name, measure/aggregation or ratio, allowed dimensions, time grain, owner)."
      - "A governance review: single-source-of-truth conflicts, undeclared dimensions, point-in-time/period-boundary risks, and additive-reconciliation notes."
      - "The definition wired for the runtime evaluator (`src/quantsmith/pipelines/metrics_semantic_layer.py`)."
      - "Handoffs to the dashboard, quality-guard, and reporting agents."
  - name: "analytics/nl_analytics"
    category: "analytics"
    purpose: "The NL Analytics Agent turns a user's natural-language data question into a governed answer: a validated `QueryPlan` (never free-form SQL), a chart, and grounded insights, delivered as a chat response and/or an approved, reversible database write-back."
    path: "agents/analytics/nl_analytics/"
    inputs:
      - "A natural-language question, plus enough context to interpret it: the semantic layer (`0008`), the viewer's access clearance (`0058`), an as-of period, and (optionally) a prior interpretation or persisted insight to com…"
      - "For write-back: a filled-in `writeback_contract.md` (target, deny-list, approval mode) and an approval decision when the contract requires one."
    outputs:
      - "A typed chat response: an answer (chart, insights, narrative, citations), a clarification request, a masked/empty/stale result, or a write-rejected status — never a silent wrong answer."
      - "Optionally, an append-only, idempotent, reversible write-back record."
      - "Optionally, a `0070` audit envelope (prompt/context manifests, assumption ledger, audit events, replay-checkable hashes) for the run."
  - name: "asset_classes/commodities"
    category: "asset_classes"
    purpose: "The Commodities & Futures Mechanics Agent handles the conventions and roll mechanics specific to commodity futures: curve shape (contango/backwardation), roll yield and roll-date scheduling, physical delivery vs cash settlement, storage and carry cost, and seasonality."
    path: "agents/asset_classes/commodities/"
    inputs:
      - "The commodity, contract(s), and date range in question."
      - "The continuous-series construction method (roll method, roll dates/window)."
      - "Curve data (front month vs deferred months) for contango/backwardation assessment."
      - "Any physical-delivery, storage, or seasonality context relevant to the request."
    outputs:
      - "A conventions brief: contract specs (tick, lot, expiry calendar), physical delivery vs cash settlement."
      - "A roll-mechanics treatment: roll method, roll-date schedule, and the roll yield/cost it implies."
      - "A curve-shape (contango/backwardation) and storage/convenience-yield view."
      - "Physical-delivery risk scoped near expiry, where relevant."
      - "A named handoff to `trading_strategies/`, `securities_financing/`, or `risk`."
  - name: "asset_classes/digital_assets"
    category: "asset_classes"
    purpose: "The Digital Assets Market Mechanics Agent handles the market-structure mechanics specific to crypto/digital assets: venue fragmentation, 24/7 trading, custody models, perpetual-futures funding, and on-chain settlement risk."
    path: "agents/asset_classes/digital_assets/"
    inputs:
      - "The asset(s), venue(s) or aggregator source, and instrument type (spot, perpetual, dated future)."
      - "The custody arrangement for any position."
      - "Funding-rate data and its calculation/mark-price methodology, for perpetuals."
      - "Any on-chain settlement, oracle, or smart-contract dependency relevant to the request."
    outputs:
      - "A venue/price-discovery brief: which venue(s) or aggregator the price is sourced from, and fragmentation risk."
      - "A custody and counterparty-risk assessment (exchange custody, self-custody, qualified custodian)."
      - "A funding-rate mechanics treatment for perpetuals: calculation method, mark vs index price, point-in-time funding history."
      - "On-chain settlement, oracle, and smart-contract risk named where relevant."
      - "A named handoff to `trading_strategies/`, `securities_financing/`, or `risk`."
  - name: "asset_classes/equities"
    category: "asset_classes"
    purpose: "The Equities Market Mechanics Agent handles the market-structure and data mechanics specific to listed equities: venues, sessions, corporate actions, index membership, short-sale mechanics, and settlement."
    path: "agents/asset_classes/equities/"
    inputs:
      - "The instrument(s), venue(s), and the date range in question."
      - "Raw price/volume series and their adjustment status."
      - "The universe definition and its membership/reconstitution rule."
      - "Any short-sale, locate, or borrow context relevant to the request."
    outputs:
      - "A market-structure brief: venue(s), session structure, tick/lot size, settlement lag (T+1/T+2)."
      - "The corporate-action adjustment method used (splits, dividends, spin-offs) and its look-ahead risk."
      - "A point-in-time index-membership treatment (reconstitution dates, no survivorship)."
      - "Short-sale mechanics scoped for handoff: locate requirement, Reg SHO relevance, hard-to-borrow flag."
      - "A named handoff to `trading_strategies/`, `securities_financing/`, or `risk`."
  - name: "asset_classes/fixed_income_rates"
    category: "asset_classes"
    purpose: "The Fixed Income, Rates & Credit Mechanics Agent handles the conventions and construction mechanics specific to bonds, rates, and credit: day-count and accrual conventions, clean vs dirty pricing, yield-curve construction, credit spreads and rating migrations, and auction/on-the-run conventions."
    path: "agents/asset_classes/fixed_income_rates/"
    inputs:
      - "The instrument(s) (bond, note, swap, CDS, …) and the date range in question."
      - "Raw price/yield data and the day-count/accrual convention in use."
      - "Curve construction inputs (nodes, tenors, interpolation method)."
      - "Credit rating and spread history, with vintage/point-in-time context."
    outputs:
      - "A conventions brief: day-count basis, accrual method, clean vs dirty pricing."
      - "A point-in-time yield-curve construction (bootstrapping/interpolation method, node dates as of the decision date)."
      - "Credit-spread and rating treatment, with point-in-time vintage (no future rating-migration look-ahead)."
      - "On-the-run/off-the-run and auction-calendar context where liquidity matters."
      - "A named handoff to `trading_strategies/`, `optimization/`, or `risk`."
  - name: "asset_classes/fx"
    category: "asset_classes"
    purpose: "The FX Market Mechanics Agent handles the conventions and session mechanics specific to foreign exchange: spot/forward/swap points, settlement, fixing windows, and the 24-hour session structure."
    path: "agents/asset_classes/fx/"
    inputs:
      - "The currency pair(s), instrument type (spot/forward/swap/NDF), and date range."
      - "Settlement/value-date conventions in use."
      - "Forward-points or interest-rate data feeding a carry calculation."
      - "The fixing window or benchmark rate the strategy references, if any."
    outputs:
      - "A conventions brief: settlement/value date (T+2 spot standard), spot vs forward/swap points, NDF vs deliverable."
      - "A carry/forward-points treatment tied to interest-rate parity, point-in-time."
      - "Fixing-window risk scoped where the strategy marks to a benchmark fix."
      - "Regional liquidity-window context (Asia/London/NY sessions) where it affects execution."
      - "A named handoff to `trading_strategies/`, `optimization/`, or `risk`."
  - name: "backtest_review"
    category: "root"
    purpose: "The Backtest Review Agent reviews strategy simulations, alpha tests, portfolio construction experiments, and historical model evaluations for validity, bias, robustness, and handoff quality."
    path: "agents/backtest_review/"
    inputs:
      - "Strategy or model description."
      - "Universe, rebalance schedule, and holding period."
      - "Data sources and point-in-time assumptions."
      - "Signal generation logic."
      - "Portfolio construction and constraints."
      - "Cost, slippage, borrow, and market impact assumptions."
    outputs:
      - "Backtest review."
      - "Bias and fragility checklist."
      - "Required robustness tests."
      - "Production-readiness blockers."
      - "Backtest report updates."
  - name: "credit_risk/counterparty_limits"
    category: "credit_risk"
    purpose: "The Counterparty Limits Agent aggregates credit exposure by counterparty across facilities, checks it against a registered limit, and flags concentration — the exposure-management half of wholesale credit review that needs no institution-specific rating or PD model to do correctly."
    path: "agents/credit_risk/counterparty_limits/"
    inputs:
      - "Facility-level measurements: EAD, expected loss (or a named basis violation), counterparty ID."
      - "A limit registry: one limit per counterparty with exposure. An unregistered counterparty with exposure is a defect to report, not a case to skip."
      - "A concentration threshold — always supplied by the caller; this agent never assumes one."
    outputs:
      - "Per-counterparty aggregated exposure and expected loss, with any basis-violated facility named separately."
      - "A limit-check result per counterparty: `within_limit` or `breached`, with the exact breach amount."
      - "A concentration report: largest counterparty share, Herfindahl index, and whether the supplied threshold is breached."
  - name: "credit_risk/credit_document_analyst"
    category: "credit_risk"
    purpose: "The Credit Document Analyst Agent turns unstructured credit documents — credit memos, covenant letters, financial commentary — into cited, governed evidence that a human can promote into a credit decision."
    path: "agents/credit_risk/credit_document_analyst/"
    inputs:
      - "One or more documents registered against a disclosed, synthetic-or-real source under `sources/` — never an unregistered file."
      - "The `0072` decision path the extraction will eventually feed (`path.credit_document_intelligence` by default)."
    outputs:
      - "A `0071` corpus snapshot, transform chain, task-result set, and audit ledger, wrapped in a `0070` run envelope — reproducible by replay."
      - "A `0072` admission result: `derived_evidence` by default, `decision_input` only once a named human reviewer, review date, and review scope are recorded on the source task result."
      - "An explicit statement of what was *not* extracted with confidence, never a silently omitted gap."
  - name: "credit_risk/fair_lending_review"
    category: "credit_risk"
    purpose: "The Fair Lending Review Agent tests an already-scored population for disparate impact, measures whether a feature is a statistical proxy for protected-class membership, and searches for a less-discriminatory cutoff — the substantive fairness testing half of retail underwriting that `0072`'s decision contract requires but that attribute-absence checks alone cannot satisfy."
    path: "agents/credit_risk/fair_lending_review/"
    inputs:
      - "A scored population: each applicant's score, protected-class-membership indicator (observed, or estimated by the caller's own declared method — this agent never estimates one), and named feature values."
      - "The cutoff actually applied, and the disparity threshold the institution has chosen (never a default this agent supplies)."
      - "When the baseline breaches the threshold: candidate alternative cutoffs and the maximum acceptable change in overall approval rate."
    outputs:
      - "The adverse impact ratio at the applied cutoff, with per-group approval rates and whether the threshold is breached."
      - "A correlation between each named feature and protected-class membership."
      - "When breached: a less-discriminatory-alternative search result — the recommended cutoff, or an honest report that none was found within tolerance, feeding `0072`'s required business-need-rationale record."
  - name: "data-prep-agent"
    category: "root"
    purpose: "The Data Prep Agent cleans, profiles, and transforms analytics datasets before dashboard or report generation."
    path: "agents/data-prep-agent/"
    inputs:
      - "The raw dataset and its schema."
      - "The cleaning and transformation requirements."
      - "Downstream use (dashboard, report, model) and its constraints."
    outputs:
      - "A profiling summary (missingness, outliers, type drift)."
      - "Deterministic cleaning steps applied (null handling, dedup, casting)."
      - "The requested transformations and features."
      - "Transformation lineage and data-quality checks."
      - "A validated dataset with schema metadata."
    skill_path: "agents/data-prep-agent/SKILL.md"
    interface:
      inputs:
        - "raw_dataset"
        - "transformation_requirements"
      outputs:
        - "transformed_dataset"
        - "data_quality_report"
  - name: "data_engineering/data_governance"
    category: "data_engineering"
    purpose: "The Data Governance Agent owns the data catalog, lineage, access policy, ownership, and classification so datasets are discoverable, owned, and access-controlled."
    path: "agents/data_engineering/data_governance/"
    inputs:
      - "The sources, targets, and business grain in scope."
      - "Data contracts (`templates/data/data_contract.md`), governed metrics (`0008`), and the pipeline DAG (`0011`) where relevant."
      - "Ownership, SLA, and environment expectations."
    outputs:
      - "A reviewed design or plan for this concern, with explicit contracts and trade-offs."
      - "Spec-ready requirements, risks, and acceptance criteria."
      - "Handoffs to `knowledge/institutional_memory`, `secrets_management/*`, and `pipeline_observability`."
  - name: "data_engineering/data_modeling"
    category: "data_engineering"
    purpose: "The Data Modeling Agent designs dimensional and warehouse models: grain, natural/surrogate keys, star and snowflake schemas, slowly-changing dimensions, and conformed dimensions across marts."
    path: "agents/data_engineering/data_modeling/"
    inputs:
      - "The sources, targets, and business grain in scope."
      - "Data contracts (`templates/data/data_contract.md`), governed metrics (`0008`), and the pipeline DAG (`0011`) where relevant."
      - "Ownership, SLA, and environment expectations."
    outputs:
      - "A reviewed design or plan for this concern, with explicit contracts and trade-offs."
      - "Spec-ready requirements, risks, and acceptance criteria."
      - "Handoffs to `pipeline_orchestration`, `data_quality`, and `analytics/metrics_semantic_layer`."
  - name: "data_engineering/pipeline_builder"
    category: "data_engineering"
    purpose: "The Pipeline Builder Agent compiles a source -> transform -> sink intent into a reviewable DAG: steps with data contracts, schedules, retries, backfills, idempotency, tests, ownership, and a deployment plan."
    path: "agents/data_engineering/pipeline_builder/"
    inputs:
      - "The sources, targets, and business grain in scope."
      - "Data contracts (`templates/data/data_contract.md`), governed metrics (`0008`), and the pipeline DAG (`0011`) where relevant."
      - "Ownership, SLA, and environment expectations."
    outputs:
      - "A reviewed design or plan for this concern, with explicit contracts and trade-offs."
      - "Spec-ready requirements, risks, and acceptance criteria."
      - "Handoffs to `pipeline_orchestration`, `pipeline_deployment`, and `data_quality`."
  - name: "data_engineering/pipeline_deployment"
    category: "data_engineering"
    purpose: "The Pipeline Deployment Agent handles environment promotion for data pipelines: dry runs, canaries, rollback, state migration, and scheduler-specific deployment adapters."
    path: "agents/data_engineering/pipeline_deployment/"
    inputs:
      - "The sources, targets, and business grain in scope."
      - "Data contracts (`templates/data/data_contract.md`), governed metrics (`0008`), and the pipeline DAG (`0011`) where relevant."
      - "Ownership, SLA, and environment expectations."
    outputs:
      - "A reviewed design or plan for this concern, with explicit contracts and trade-offs."
      - "Spec-ready requirements, risks, and acceptance criteria."
      - "Handoffs to `pipeline_orchestration`, `deployment_release`, and `secrets_management/*`."
  - name: "data_engineering/pipeline_observability"
    category: "data_engineering"
    purpose: "The Pipeline Observability Agent turns a pipeline's run manifest into a health read: per-step status, data freshness against a watermark, data-downtime detection, an SLA verdict, and a lineage view."
    path: "agents/data_engineering/pipeline_observability/"
    inputs:
      - "A `RunManifest` from the DAG runner (`0011`, `src/quantsmith/pipelines/data_pipeline.py`)."
      - "A freshness watermark (the partition each step is expected to have reached)."
      - "The `Pipeline` (for lineage) and an optional max-attempts SLA."
    outputs:
      - "An `ObservabilityReport`: per-step health (status counts, latest ok partition, attempts, fresh/downtime flags), freshness breaches, downtime steps, an SLA verdict, and a lineage map."
      - "A degraded/healthy status and the specific SLA breaches."
      - "Handoffs to `maintenance_monitoring`, the alerts agents, and `pipeline_orchestration`."
  - name: "data_engineering/pipeline_orchestration"
    category: "data_engineering"
    purpose: "The Pipeline Orchestration Agent designs and reviews data pipelines as directed acyclic graphs (DAGs) with the guarantees a data engineer relies on: dependency ordering, a data contract on every step's output, idempotent partitioned execution, bounded retries, backfill of only the missing partitions, and a run manifest for observability."
    path: "agents/data_engineering/pipeline_orchestration/"
    inputs:
      - "The sources, transforms, and sinks, and how they depend on each other."
      - "The partition scheme (e.g., daily) and the backfill window."
      - "The output schema for each step (columns, types, required fields)."
      - "Idempotency, retry, and freshness/SLA expectations."
    outputs:
      - "A DAG of steps with declared dependencies and per-step data contracts."
      - "An execution plan: partitioning, idempotency strategy, retry policy, and backfill."
      - "A run manifest design for observability (per-step, per-partition status)."
      - "Handoffs to `data-prep-agent`, `data_quality`, and the ingestion agents."
  - name: "data_ingestion/api_ingestion"
    category: "data_ingestion"
    purpose: "The API Ingestion Agent pulls data from REST, streaming, and vendor APIs reproducibly."
    path: "agents/data_ingestion/api_ingestion/"
    inputs:
      - "The API, endpoints, and auth method."
      - "The data needed and its natural pagination/keying."
      - "Rate limits, quotas, and cost constraints."
      - "Point-in-time / as-of requirements and update semantics."
    outputs:
      - "An auth approach with secrets from env/secrets (never in repo)."
      - "Pagination, rate-limit, and retry/backoff handling."
      - "As-of capture with a timestamp and archived raw payloads."
      - "Incremental vs full-load design with idempotency."
      - "Response schema validation and a data contract."
  - name: "data_ingestion/database_connectivity"
    category: "data_ingestion"
    purpose: "The Database Connectivity Agent connects to SQL databases and warehouses and pulls data safely and reproducibly."
    path: "agents/data_ingestion/database_connectivity/"
    inputs:
      - "Target database/warehouse and access method."
      - "The data needed: tables, columns, date range, and grain."
      - "Point-in-time / as-of requirements and known revision behavior."
      - "Volume expectations and any latency or cost constraints."
    outputs:
      - "A connection approach with credentials sourced from env/secrets (never in repo)."
      - "A parameterized, read-only-where-possible query."
      - "A point-in-time / as-of extraction plan."
      - "A snapshot identifier/hash and how to reproduce the pull."
      - "A data contract and dataset card for the extracted data."
  - name: "data_ingestion/file_ingestion"
    category: "data_ingestion"
    purpose: "The File Ingestion Agent reads data files across formats into typed, validated tables."
    path: "agents/data_ingestion/file_ingestion/"
    inputs:
      - "The file(s), format, and a sample or schema."
      - "Expected columns, types, keys, and grain."
      - "Encoding, delimiter, header, and date/timezone conventions."
      - "Volume and any streaming/memory constraints."
    outputs:
      - "A typed loader with an explicit schema (no silent inference)."
      - "Encoding, delimiter, and header handling."
      - "Date/timezone parsing and missing-value handling."
      - "A validation step that fails loudly on contract violations."
      - "A file snapshot (checksum) and a data contract / dataset card."
  - name: "data_quality"
    category: "root"
    purpose: "The Data Quality Agent reviews datasets, joins, feature inputs, and labels for correctness risks before they drive research, modeling, backtesting, or production decisions."
    path: "agents/data_quality/"
    inputs:
      - "Dataset description and source."
      - "Schema or sample columns."
      - "Date range, frequency, and update schedule."
      - "Join keys and timestamp semantics."
      - "Known filters, transformations, and imputation rules."
      - "Intended downstream use."
    outputs:
      - "Data quality review."
      - "Dataset card draft."
      - "Lineage and transformation summary."
      - "Leakage and time-alignment risk list."
      - "Required validation checks."
  - name: "deep_learning/compression_serving"
    category: "deep_learning"
    purpose: "Owns distillation, quantization, pruning, batching, latency, memory, GPU utilization, and serving contracts."
    path: "agents/deep_learning/compression_serving/"
    inputs:
      - "Business decision, objective, or model purpose."
      - "Candidate data sources, freshness, grain, and point-in-time availability."
      - "Constraints, costs, service levels, risk limits, and operational policies."
      - "Current spec, plan, tasks, run card, or experiment artifacts when available."
    outputs:
      - "A scoped recommendation or review finding."
      - "Required inputs, assumptions, risks, and acceptance criteria."
      - "Handoff notes for adjacent agents and lifecycle stages."
      - "Spec-ready requirements, tasks, tests, and monitoring hooks when the work should be promoted."
  - name: "deep_learning/computer_vision"
    category: "deep_learning"
    purpose: "Handles image/document/screenshot models, OCR-adjacent workflows, augmentation, labeling, and visual quality checks."
    path: "agents/deep_learning/computer_vision/"
    inputs:
      - "Business decision, objective, or model purpose."
      - "Candidate data sources, freshness, grain, and point-in-time availability."
      - "Constraints, costs, service levels, risk limits, and operational policies."
      - "Current spec, plan, tasks, run card, or experiment artifacts when available."
    outputs:
      - "A scoped recommendation or review finding."
      - "Required inputs, assumptions, risks, and acceptance criteria."
