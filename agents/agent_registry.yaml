  - name: "economists/cross_asset_macro_linkages"
    category: "economists"
    purpose: "The Cross-Asset Macro Linkages Agent translates a classified macro regime into how it's typically expressed across rates, FX, credit, equities, and commodities — the backdrop a strategy operates in."
    path: "agents/economists/cross_asset_macro_linkages/"
    inputs:
      - "A regime classification (from `macro_regime_classifier`, or supplied directly)."
      - "The asset classes in scope for the read."
      - "Recent cross-asset price/spread behavior, when available, for a consistency check against the regime read."
    outputs:
      - "A per-asset-class read (rates, FX, credit, equities, commodities) of how the current regime is typically expressed, with the historical/economic rationale stated."
      - "Where supplied price/spread behavior is available, an explicit note on whether it's consistent with or diverging from the regime read."
      - "Named uncertainty where the regime-to-asset-class link is weaker or historically inconsistent."
      - "A named handoff to `research_analyst` or the relevant `trading_strategies/*` agent."
  - name: "economists/economic_outlook_report_writer"
    category: "economists"
    purpose: "The Economic Outlook Report Writer Agent turns the group's accumulated reads into a longer, periodic (monthly/quarterly) outlook report (`templates/docs/macro_backdrop_report.md`, `Cadence: outlook`) — a fuller deliverable than `macro_backdrop_summarizer`'s recurring brief, suitable for an IC-facing or portfolio-review context."
    path: "agents/economists/economic_outlook_report_writer/"
    inputs:
      - "Recent and historical outputs from all five upstream `economists/` agents (indicators, policy, regime, cross-asset, scenario), or equivalent information supplied directly."
      - "The reporting period and as-of date."
      - "The audience/workflow this report is feeding."
    outputs:
      - "A populated `templates/docs/macro_backdrop_report.md` at `Cadence: outlook` — full indicator dashboard, policy read, regime read, cross-asset implications, scenario watch, risks, and gaps."
      - "An explicit as-of date and reporting period."
      - "Any pillar without fresh input for this period is named as a gap."
  - name: "economists/macro_backdrop_summarizer"
    category: "economists"
    purpose: "The Macro Backdrop Summarizer Agent turns the group's accumulated reads — indicators, policy, regime, cross-asset — into a concise, recurring macro brief (`templates/docs/macro_backdrop_report.md`, `Cadence: brief`) that a quant or PM workflow can start from without reconstructing the backdrop itself."
    path: "agents/economists/macro_backdrop_summarizer/"
    inputs:
      - "Recent outputs from `macro_indicator_analyst`, `monetary_policy_analyst`, `macro_regime_classifier`, and `cross_asset_macro_linkages` (or equivalent information supplied directly)."
      - "The as-of date for the brief."
      - "The workflow(s) this brief is feeding, when known."
    outputs:
      - "A populated `templates/docs/macro_backdrop_report.md` at `Cadence: brief` — snapshot, what changed, indicator highlights, policy read, regime read, risks/watch list."
      - "An explicit as-of date on every brief."
      - "Any input pillar not yet available for this cycle is named as a gap, not skipped silently."
  - name: "economists/macro_indicator_analyst"
    category: "economists"
    purpose: "The Macro Indicator Analyst Agent tracks and interprets core economic releases — inflation, growth, labor, housing, trade — turning a raw print into a vintage-aware, surprise-vs-consensus read."
    path: "agents/economists/macro_indicator_analyst/"
    inputs:
      - "The release(s) in scope and their as-of/release date."
      - "The registered source (`sources/{fred,bls,bea,census,eia}.yml`) where available, or the raw figures supplied directly."
      - "Consensus/expectation figures, when available, for a surprise read."
      - "Prior-period values, for trend context."
    outputs:
      - "A vintage-labeled indicator read: value, first-print or revised, and the release date."
      - "A surprise-vs-consensus assessment when consensus is available, stated as \"no consensus supplied\" otherwise — never inferred."
      - "Trend context (acceleration/deceleration, level vs. rate-of-change) when prior-period data is available."
      - "Any indicator or figure not yet released or not supplied is named as a gap, not filled with an estimate."
  - name: "economists/macro_regime_classifier"
    category: "economists"
    purpose: "The Macro Regime Classifier Agent synthesizes indicator reads and policy reads into a classified economic regime — a growth/inflation quadrant, business-cycle phase, or tightening/easing label — with the confidence and evidence behind it."
    path: "agents/economists/macro_regime_classifier/"
    inputs:
      - "Indicator reads from `macro_indicator_analyst` (or supplied directly)."
      - "Policy reads from `monetary_policy_analyst` (or supplied directly)."
      - "The prior regime classification, for a change assessment."
    outputs:
      - "A regime label (e.g. \"reflationary growth,\" \"late-cycle tightening,\" \"disinflationary slowdown\") with the specific indicators and policy signals supporting it."
      - "A confidence/conviction level, stated explicitly — not implied by tone."
      - "What would change the classification (named conditions, not vague caveats)."
      - "A named handoff to `macro_multi_asset` or `portfolio_management/allocation_policy`."
  - name: "economists/macro_scenario_analyst"
    category: "economists"
    purpose: "The Macro Scenario Analyst Agent builds forward macro stress scenarios (hard landing, stagflation, geopolitical shock, and similar) with quantified indicator paths — not just a narrative — so `risk` and `backtest_review` have something concrete to stress-test against."
    path: "agents/economists/macro_scenario_analyst/"
    inputs:
      - "The current regime classification, for a baseline to deviate from."
      - "The scenario category in scope (recession, stagflation, geopolitical shock, policy error, or a user-specified one)."
      - "Any known historical analog to ground the scenario in, when relevant."
    outputs:
      - "A named scenario with a quantified indicator path: which indicators move, in what direction, and roughly how much — not only a prose description."
      - "The economic logic connecting the scenario's trigger to its indicator path."
      - "A rough plausibility/likelihood characterization, stated as a judgment, not a precise probability the input doesn't support."
      - "A named handoff to `risk` (for stress testing) or `backtest_review` (for scenario-based robustness testing)."
  - name: "economists/monetary_policy_analyst"
    category: "economists"
    purpose: "The Monetary Policy Analyst Agent reads central bank stance, rate path, and balance-sheet actions — turning a statement, minutes, or a rate decision into a policy read `macro_regime_classifier` and `research_analyst` can build on."
    path: "agents/economists/monetary_policy_analyst/"
    inputs:
      - "The policy statement, minutes, decision, or press-conference material in scope, and its date."
      - "The prior policy stance, for a change assessment."
      - "Market-implied expectations (e.g. a priced rate path), when supplied."
    outputs:
      - "A stance read (hawkish/dovish/neutral, with the specific language or action supporting that read)."
      - "A rate-path and balance-sheet characterization against what was expected, when expectations were supplied."
      - "Named conditions that would shift the stance (\"data-dependent on X\")."
      - "Any statement, decision, or figure not yet available is named as a gap, not inferred."
  - name: "economists/morning_brief_writer"
    category: "economists"
    purpose: "The Morning Brief Writer Agent turns the day's pulled market commentary — real headlines and, where available, a sentiment rollup, computed by `src/quantsmith/pipelines/market_brief.py` from NewsAPI, Alpha Vantage `NEWS_SENTIMENT`, and Finnhub — into the \"Views & Analysis\" section of `templates/docs/morning_market_brief.md` (spec `0059`)."
    path: "agents/economists/morning_brief_writer/"
    inputs:
      - "`market_brief.top_headlines`'s output: headlines grouped by watchlist topic/ticker, each with its provider, publish time, and URL."
      - "`market_brief.sentiment_rollup`'s output, where Alpha Vantage covered a topic (absent for topics it didn't — never treat that absence as neutral sentiment)."
      - "Optionally, the day's `templates/docs/macro_backdrop_report.md` (from `macro_backdrop_summarizer`) for broader macro context to frame the headlines against."
    outputs:
      - "Markdown for the \"Views & Analysis\" section only — not the full report. `market_brief.render_morning_brief` composes this with the computed Headlines/Sentiment Rollup sections; this agent does not call it."
      - "Every claim traces to a specific supplied headline or the sentiment rollup, or is stated as a gap — never an unsupported assertion about the market."
      - "A watchlist topic/ticker with no material coverage today is named as such, not silently dropped."
  - name: "eda-specialist-agent"
    category: "root"
    purpose: "The EDA Specialist Agent performs exploratory data analysis on transformed datasets: schema and row-count validation, summary statistics, missingness and anomaly checks, feature-level statistics, and early hypothesis generation before modeling or dashboard publication."
    path: "agents/eda-specialist-agent/"
    inputs:
      - "The transformed dataset and its schema."
      - "The analytical mode or question of interest."
      - "Any known baselines or expectations."
    outputs:
      - "Schema and row-count validation."
      - "Numeric summary statistics for measurable fields."
      - "Missingness patterns and unusual value ranges."
      - "Concise insights tailored to the analytical mode."
      - "Recommended next analytical actions."
    skill_path: "agents/eda-specialist-agent/SKILL.md"
  - name: "enterprise_risk/aml_financial_crime"
    category: "enterprise_risk"
    purpose: "The AML & Financial Crime Agent reviews transaction-monitoring and sanctions-screening program health — alert funnel metrics, false-positive rates, and KYC currency — without ever surfacing an individual alert, case, or SAR's content, which stays strictly confidential."
    path: "agents/enterprise_risk/aml_financial_crime/"
    inputs:
      - "Aggregate alert, case, and SAR counts by scenario or rule, over a stated period — never individual alert or case records."
      - "Scenario-tuning history (dates and what changed), so a volume shift can be attributed to tuning versus underlying activity."
      - "KYC refresh due dates by customer risk rating, in aggregate."
      - "Alert backlog counts by age."
    outputs:
      - "Funnel metrics: alerts generated, escalated to case, and filed as SAR, with conversion rates at each stage."
      - "False-positive rate with the scenario-tuning history alongside it, so a volume or rate change is correctly attributed."
      - "KYC-overdue counts by risk rating and how overdue, in aggregate."
      - "Backlog age distribution — never any individual alert, case, or customer identity."
  - name: "enterprise_risk/climate_esg_risk"
    category: "enterprise_risk"
    purpose: "The Climate & ESG Risk Agent reviews financed-emissions data quality, transition-risk sector exposure, and physical-hazard exposure — measurement and disclosure support, never a scenario-probability or target-adequacy judgment."
    path: "agents/enterprise_risk/climate_esg_risk/"
    inputs:
      - "Exposure data by counterparty or asset, with sector and geography."
      - "Emissions data or estimates per counterparty, with the attribution method (e.g., PCAF) and its data-quality score."
      - "A hazard dataset for physical-risk exposure, if physical risk is in scope — this agent does not generate hazard data itself."
      - "The vintage of every emissions or hazard input, since both are estimated and revised over time."
    outputs:
      - "Financed emissions with attribution method and data-quality score stated per figure, never a bare tCO2e number."
      - "Transition-risk sector exposure as a share of the portfolio, ranked and separated from a carbon-intensity metric (they can rank differently)."
      - "Physical-hazard exposure by geography, with the hazard dataset and its vintage named."
      - "Scope 1, 2, and 3 reported separately, with an explicit warning against summing Scope 3 across counterparties or into a Scope 1+2 total."
  - name: "enterprise_risk/counterparty_credit_risk"
    category: "enterprise_risk"
    purpose: "The Counterparty Credit Risk Agent measures derivative and securities-financing counterparty exposure — current and potential future exposure after netting and collateral — distinct from the wholesale-credit facility view `agents/credit_risk/counterparty_limits` already covers."
    path: "agents/enterprise_risk/counterparty_credit_risk/"
    inputs:
      - "Trade-level mark-to-market and the netting set each trade belongs to."
      - "CSA terms: threshold, minimum transfer amount, and posted collateral, per netting set."
      - "A PFE or expected-exposure profile, if quantile-based exposure is in scope — this agent does not compute it from scratch."
      - "The counterparty limit to compare against."
    outputs:
      - "Current exposure per netting set: positive MTM after netting and collateral, never a sum of gross trade-level marks."
      - "PFE or expected exposure against the stated limit, with confidence and horizon named."
      - "Limit utilization per counterparty, and a named breach where it occurs."
      - "A wrong-way-risk flag where exposure and counterparty credit quality appear correlated, kept separate from the exposure measurement itself."
  - name: "enterprise_risk/liquidity_treasury_risk"
    category: "enterprise_risk"
    purpose: "The Liquidity & Treasury Risk Agent reviews regulatory and internal liquidity metrics and balance-sheet interest-rate risk (IRRBB) — LCR, NSFR, and NII/EVE sensitivity — the bank-level treasury view, distinct from `agents/portfolio_management/liquidity_cash_management`'s fund-level cash and redemption view."
    path: "agents/enterprise_risk/liquidity_treasury_risk/"
    inputs:
      - "LCR/NSFR (or equivalent) inputs: HQLA by level, stressed net cash outflows, available and required stable funding."
      - "NII/EVE sensitivity outputs per scenario, with the behavioral assumption set used to produce them."
      - "Entity and currency structure, if liquidity fungibility across entities is in scope."
      - "The regulatory minimum and internal buffer to compare against."
    outputs:
      - "LCR/NSFR against regulatory minimum and internal buffer, with calculation date and period-end-versus-average basis stated."
      - "NII/EVE sensitivity by scenario, with the behavioral assumption set named alongside every number."
      - "A named finding wherever liquidity or funding is concentrated by entity, currency, or counterparty in a way that a consolidated total would hide."
      - "An explicit statement of headroom (or shortfall) against both the regulatory minimum and the stricter internal buffer, since they are not the same threshold."
  - name: "enterprise_risk/model_risk_management"
    category: "enterprise_risk"
    purpose: "The Model Risk Management Agent reviews a model inventory's validation currency, open finding severity, and override behavior — the governance discipline that sits above any single model's own validation, across the whole inventory."
    path: "agents/enterprise_risk/model_risk_management/"
    inputs:
      - "The model inventory: model name, tier (materiality), owner, last validation date, and the tier's required revalidation cadence."
      - "Open findings per model: severity, age, and remediation status."
      - "Override counts and total decisions per model, if override rate is in scope."
      - "The inventory's own definition of what counts as a model (versus a tool or an end-user computation) — this agent does not redefine it."
    outputs:
      - "Overdue-validation list, sorted by how overdue and by tier — a high-tier model overdue by one day is not the same finding as a low-tier model overdue by a year, and the report says so."
      - "Open findings aged and ranked by severity, with remediation status."
      - "Override rate per model with the raw counts behind it, never a rate with no denominator shown."
      - "An explicit statement of the inventory definition used, since model counts are not comparable across differently-scoped inventories."
  - name: "enterprise_risk/operational_risk"
    category: "enterprise_risk"
    purpose: "The Operational Risk Agent reviews operational loss events, control gaps, and key risk indicator (KRI) breaches — the risk that a process, a system, a person, or an external event causes a loss, distinct from market or credit risk."
    path: "agents/enterprise_risk/operational_risk/"
    inputs:
      - "Loss events with occurrence, discovery, and accounting dates; event type; business line; gross and net amounts."
      - "The firm's loss-collection threshold, so events below it are known to be excluded, not silently absent."
      - "KRI values and their declared thresholds and owners."
      - "Open control-testing or audit findings, if a broader review is in scope."
    outputs:
      - "Losses classified by Basel event type and business line, gross and net of recovery/insurance, with the collection threshold stated."
      - "A finding per KRI breach: the metric, the threshold, the owner, and how long it has been breached."
      - "A control-gap list distinct from confirmed losses — a near-miss is not yet a loss and should never be reported as one."
      - "An explicit note when recent losses are still developing (occurrence recent, discovery/accounting lag) rather than presented as final."
  - name: "feature_engineering"
    category: "root"
    purpose: "The Feature Engineering Agent proposes, documents, and reviews feature transformations."
    path: "agents/feature_engineering/"
    inputs:
      - "Feature definitions or the code that computes them."
      - "Source data, frequency, and availability timing."
      - "Target and prediction horizon."
      - "Intended model and how features will be normalized."
    outputs:
      - "Feature definitions with point-in-time semantics."
      - "Leakage and look-ahead review."
      - "Stationarity and stability assessment."
      - "Normalization/scaling plan that fits only on training data."
      - "A feature data dictionary."
  - name: "formulaic_alphas/alpha_combination"
    category: "formulaic_alphas"
    purpose: "The Alpha Combination Agent combines many formulaic alphas into a portfolio."
    path: "agents/formulaic_alphas/alpha_combination/"
    inputs:
      - "The set of alphas and their historical signal/return series."
      - "The existing combined book, if any."
      - "Weighting approach and any constraints (turnover, exposure)."
      - "Correlation and capacity considerations."
    outputs:
      - "A pairwise-correlation assessment of the alpha set."
      - "A spanning/regression test: does a new alpha add beyond the existing book?"
      - "A weighting scheme (equal, regression, optimized) with rationale."
      - "The diversification benefit and combined-book characteristics."
      - "Turnover and cost implications of the combination."
  - name: "formulaic_alphas/alpha_construction"
    category: "formulaic_alphas"
    purpose: "The Alpha Construction Agent builds and reviews formulaic alphas from the operator library."
    path: "agents/formulaic_alphas/alpha_construction/"
    inputs:
      - "The idea or edge to express, and the universe and asset class."
      - "Available inputs (`open/high/low/close/volume/vwap/returns/adv/cap`), point-in-time."
      - "Intended holding period and neutralization scheme."
      - "Any existing formula to review."
    outputs:
      - "A formulaic alpha expression using the operator library."
      - "A per-operator point-in-time / look-ahead review."
      - "The neutralization scheme (industry/sector/market) and rationale."
      - "The economic interpretation (why this should be an edge)."
      - "Notes on where the formula is fragile or over-parameterized."
  - name: "formulaic_alphas/alpha_evaluation"
    category: "formulaic_alphas"
    purpose: "The Alpha Evaluation Agent assesses a formulaic alpha's real characteristics: holding period, turnover, volatility dependence, correlation to known alphas, capacity, and decay/crowding."
    path: "agents/formulaic_alphas/alpha_evaluation/"
    inputs:
      - "The alpha's signal and return series, point-in-time."
      - "Turnover, transaction-cost (cents-per-share), and capacity assumptions."
      - "Reference alphas/factors to correlate against."
      - "The evaluation window and out-of-sample period."
    outputs:
      - "Holding period and turnover characterization."
      - "A net-of-cost performance view (transaction costs dominate short-horizon alphas)."
      - "Volatility and factor-dependence analysis."
      - "Correlation to known alphas and crowding assessment."
      - "Capacity and decay estimates."
