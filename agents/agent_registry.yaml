      - "An append-only `templates/docs/decision_log.md` entry: decision, rationale, alternatives considered, consequences, owner, date."
      - "A prior entry is never rewritten or deleted; a changed decision gets a new entry marked \"supersedes\" the old one."
      - "A queryable summary on request: every decision recorded, and which ones have since been superseded."
  - name: "role_operations/build_handoff_writer"
    category: "role_operations"
    purpose: "The Build Handoff Writer Agent turns a project's actual current state into a draft `templates/docs/handoff_memo.md` — goal, current state, key decisions, validation status, known risks, next actions — so a handoff never depends on the next owner reconstructing context from scattered notes and memory."
    path: "agents/role_operations/build_handoff_writer/"
    inputs:
      - "The project or artifact's goal and current state."
      - "Key decisions made, with rationale — pulled from `audit_trail_keeper`'s decision log where one exists."
      - "What's been validated, what's failed, what hasn't been run yet."
      - "Known risks and limitations."
      - "Open questions and next actions, with owners where known."
    outputs:
      - "A populated draft of `templates/docs/handoff_memo.md`, using its exact section structure."
      - "Every unresolved item stated explicitly — never omitted to make the handoff look more finished than it is."
      - "A `Reviewer Notes` section flagging what the next owner should look at first."
  - name: "role_operations/demo_narrative_packager"
    category: "role_operations"
    purpose: "The Demo Narrative Packager Agent turns a working prototype and its results into a situation → insight → recommendation narrative and a one-pager, in the room's language rather than the notebook's — so a proof-of-concept demo starts from a draft to edit for tone, not a blank slide the night before."
    path: "agents/role_operations/demo_narrative_packager/"
    inputs:
      - "The prototype's actual results (metrics, charts, findings) — real outputs, not a description of hoped-for outputs."
      - "Optionally, `role_context.yml` for audience, tone, and demo-format preference."
    outputs:
      - "A situation → insight → recommendation narrative, grounded only in results actually supplied."
      - "A one-pager summary suitable for the target audience."
      - "An explicit note on any synthetic/illustrative data used in a chart or figure, per `instructions/data_provenance.md` — never blended into the narrative indistinguishably from real results."
      - "A clear \"draft\" label; this is edited and approved by the human before it's shown to anyone."
  - name: "role_operations/experiment_ledger"
    category: "role_operations"
    purpose: "The Experiment Ledger Agent logs every variant tried during prototyping — configuration, result, and why it was rejected — so a dead end never gets silently re-run, and a reviewer can see the whole search, not just the winner."
    path: "agents/role_operations/experiment_ledger/"
    inputs:
      - "Each iteration's configuration and result as it happens."
      - "The reason a variant was rejected or superseded, when applicable."
    outputs:
      - "An append-only ledger entry per variant: configuration, result, and rejection reason (or \"current best,\" if it wasn't rejected)."
      - "No omissions — every variant tried is logged, not a curated subset that makes the search look cleaner than it was."
      - "A queryable summary on request: what's been tried, what's ruled out and why, what's currently leading."
  - name: "role_operations/governance_readiness_checklist"
    category: "role_operations"
    purpose: "The Governance Readiness Checklist Agent walks `templates/docs/production_readiness_checklist.md` item by item against an artifact's actual current state, marking each item evidenced (with a citation), a gap, or not applicable — so \"are we ready\" has a specific, checkable answer instead of a confident guess."
    path: "agents/role_operations/governance_readiness_checklist/"
    inputs:
      - "The artifact's current state: what's been done, what evidence exists for each claim (a model card, a backtest report, a dataset card, a monitoring plan, an owner)."
      - "Where available, links or references to the actual evidence (not just a restated summary of it)."
    outputs:
      - "A populated `templates/docs/production_readiness_checklist.md`, every item marked evidenced (with a citation), a gap, or not applicable."
      - "A short \"blocking gaps\" summary — the items standing between the artifact and promotion, in the order they'd need to close."
  - name: "role_operations/meeting_to_action"
    category: "role_operations"
    purpose: "The Meeting-to-Action Agent turns raw meeting notes or a transcript into structured decisions, owners, and open items, and drafts the follow-up message — so the follow-up gets written right after the meeting instead of reconstructed from memory later."
    path: "agents/role_operations/meeting_to_action/"
    inputs:
      - "Raw meeting notes, a transcript, or a rough recollection."
      - "Optionally, `role_context.yml` for the audience's tone/format preference and the relevant stakeholder personas."
    outputs:
      - "A structured list of decisions made, with the rationale stated if it was given."
      - "Owners and due dates for each open item — flagged as unclear rather than guessed if the meeting didn't assign one."
      - "A draft follow-up message in the configured (or a neutral, professional default) tone, ready for the human to edit and send."
  - name: "role_operations/model_card_drafter"
    category: "role_operations"
    purpose: "The Model Card Drafter Agent turns what's already known about a model — purpose, data, methodology, validation results, limitations — into a draft `templates/docs/model_card.md`, so the card exists as a living draft from early on instead of being reconstructed from memory right before a review."
    path: "agents/role_operations/model_card_drafter/"
    inputs:
      - "Model description, purpose, and the decision it supports."
      - "Training/validation/test data description, date windows, point-in-time assumptions."
      - "Methodology, configuration, baseline, benchmark."
      - "Validation results, robustness and sensitivity findings."
      - "Known limitations and risks."
      - "Monitoring plan and reproducibility details, where available."
    outputs:
      - "A populated draft of `templates/docs/model_card.md`, using its exact section structure."
      - "An explicit gap marker on every section the input didn't cover — never a fabricated value or a silently blank field."
      - "A short \"what's still needed\" summary listing every gap found."
  - name: "role_operations/prior_art_scanner"
    category: "role_operations"
    purpose: "The Prior-Art Scanner Agent gives a hypothesis a fast first pass — related approaches, known failure modes, and open questions — so a new prototype starts from a starting point instead of a blank notebook."
    path: "agents/role_operations/prior_art_scanner/"
    inputs:
      - "The hypothesis or question."
      - "Optionally, `role_context.yml` for the domain/asset classes in scope, to scope the scan sensibly."
    outputs:
      - "Related approaches or prior attempts at similar problems, with their known strengths and failure modes."
      - "Open questions the hypothesis raises that aren't yet answered."
      - "An honest signal on how well-trodden vs. underexplored the space looks."
      - "A named handoff to `research_analyst` for a full research plan."
  - name: "role_operations/rapid_scaffolder"
    category: "role_operations"
    purpose: "The Rapid Scaffolder Agent turns a new prototype idea into a running skeleton — a repo/notebook structure, a data-contract stub, and a naive baseline — so day one of a new idea starts at iterating, not at setting up."
    path: "agents/role_operations/rapid_scaffolder/"
    inputs:
      - "The idea or hypothesis to prototype, and its rough scope."
      - "Optionally, `role_context.yml` for the asset classes/domain in scope, so the scaffold points at the right `agents/asset_classes/` mechanics agent and the right spec/template starting points."
    outputs:
      - "A suggested repo/notebook structure, following this SDK's conventions (`specs/NNNN-slug/`, `templates/spec/`, `templates/data/data_contract.md` where a data contract applies)."
      - "A data-contract stub with fields to fill in, not fabricated values."
      - "A naive baseline plan (what the simplest defensible first attempt looks like) — not a finished model."
  - name: "role_operations/second_look_backtest_reviewer"
    category: "role_operations"
    purpose: "The Second Look Backtest Reviewer Agent runs a fast, personal pre-check on a backtest result against `agents/backtest_review/`'s own Required Review Themes, so an obvious lookahead, survivorship, or cost-assumption problem gets caught before a result goes to full review — not instead of it."
    path: "agents/role_operations/second_look_backtest_reviewer/"
    inputs:
      - "Strategy or model description, universe, rebalance schedule, holding period."
      - "Data sources and point-in-time assumptions."
      - "Signal generation logic and portfolio construction."
      - "Cost, slippage, borrow, and market-impact assumptions."
      - "Performance and risk metrics."
    outputs:
      - "A fast pre-check against `backtest_review`'s Required Review Themes (lookahead/leakage, survivorship, costs, benchmark choice, robustness, risk behavior), flagging anything that looks off."
      - "An explicit recommendation to run the full `agents/backtest_review/` agent before any production-promotion decision — stated every time, not only when something looks wrong."
      - "Never a \"this is production-ready\" verdict; that determination stays `backtest_review`'s (and, downstream, `governance_readiness_checklist`'s and a human reviewer's)."
  - name: "role_operations/status_rollup"
    category: "role_operations"
    purpose: "The Status Roll-Up Agent turns a period's actual activity — commits, notebooks touched, meeting notes, decisions logged — into a draft status update, so the recurring reporting cadence stops costing an end-of-week rebuild from memory."
    path: "agents/role_operations/status_rollup/"
    inputs:
      - "A description or log of the period's activity (commits, notebook changes, meeting decisions, experiment results)."
      - "Optionally, `role_context.yml` for the audience and cadence."
    outputs:
      - "A draft status update: what happened, what's next, what's blocked — grounded only in the activity actually supplied."
      - "Gaps flagged rather than papered over (e.g., \"no update available on X\")."
  - name: "role_operations/tough_question_rehearsal"
    category: "role_operations"
    purpose: "The Tough-Question Rehearsal Agent gives demo material a fast, honest stress test: it drafts the questions a skeptical risk reviewer, a technical partner, and a client sponsor would each ask, with a suggested answer for every one — so the night before a client or committee meeting is spent rehearsing, not guessing what will get asked."
    path: "agents/role_operations/tough_question_rehearsal/"
    inputs:
      - "The demo material (narrative, one-pager, results) to rehearse against."
      - "Optionally, `role_context.yml` for the actual stakeholder personas expected."
    outputs:
      - "Questions grouped by persona (risk reviewer, technical partner, client sponsor, or whatever `role_context.yml` names), each with a suggested answer."
      - "Questions the material cannot yet answer, flagged explicitly rather than given a plausible-sounding invented answer."
      - "A prep sheet, not a transcript — concise, scannable before a meeting."
  - name: "secrets_management/credential_access"
    category: "secrets_management"
    purpose: "The Credential Access Agent covers reading and retrieving secrets at runtime safely."
    path: "agents/secrets_management/credential_access/"
    inputs:
      - "The secret(s)/keys to read and the consuming code."
      - "The secret store and its client/SDK, or the env-injection mechanism."
      - "The runtime environment(s) and their identity/role setup."
      - "Logging, caching, and concurrency considerations."
      - "A registered source's `connection.credential_ref` (`sources/*.yml`), when the credential being resolved is for a cataloged data source."
    outputs:
      - "A retrieval approach: env injection or a secrets-manager client."
      - "Least-privilege identity/role for the consumer."
      - "Safe caching (in-memory, TTL) without persisting secrets to disk."
      - "Guards against logging, echoing, or serializing secret values."
      - "A consistent local-dev and production pattern."
  - name: "secrets_management/secret_rotation"
    category: "secrets_management"
    purpose: "The Secret Rotation Agent covers writing, updating, and rotating credentials, API keys, and custom key/value entries over their lifecycle."
    path: "agents/secrets_management/secret_rotation/"
    inputs:
      - "The secret/key and the systems that consume it."
      - "The secret store's versioning and rotation capabilities."
      - "Uptime requirements and how consumers pick up new versions."
      - "Compliance/rotation-cadence and revocation requirements."
    outputs:
      - "A create/update procedure that writes to the store, never the repo."
      - "A versioning approach so old and new secrets coexist during rotation."
      - "A zero-downtime rotation sequence (dual-validity, then cutover, then revoke)."
      - "A revocation and incident-rotation path."
      - "A rotation policy: cadence, owner, and automation."
  - name: "secrets_management/secret_scanning"
    category: "secrets_management"
    purpose: "The Secret Scanning Agent detects leaked secrets in code, Git history, logs, and notebook outputs, and drives remediation."
    path: "agents/secrets_management/secret_scanning/"
    inputs:
      - "The code, diff, history, logs, or notebooks to scan."
      - "Existing scanning tooling (e.g. gitleaks, trufflehog, detect-secrets) if any."
      - "The secret store and rotation path for remediation."
    outputs:
      - "Findings: likely secrets with location and type, without echoing full values."
      - "A remediation plan: rotate, revoke, and purge from history."
      - "Prevention: pre-commit/CI scanning and an allowlist for false positives."
      - "A recommendation to add missing `.gitignore` entries."
  - name: "secrets_management/secret_storage"
    category: "secrets_management"
    purpose: "The Secret Storage Agent helps choose, provision, and structure a secret store for credentials, API keys, and custom key/value configuration."
    path: "agents/secrets_management/secret_storage/"
    inputs:
      - "The secrets and custom keys/values to store, and who/what consumes them."
      - "Available secret stores (Vault, AWS/GCP/Azure managers, or an equivalent)."
      - "Environments (dev/staging/prod) and their isolation requirements."
      - "Access, compliance, and audit constraints."
    outputs:
      - "A recommended secret store and rationale."
      - "A naming and structure convention (per environment, per service)."
      - "An access policy scoped to least privilege."
      - "Encryption-at-rest and in-transit settings."
      - "A migration plan for secrets currently in the repo or config."
  - name: "securities_financing/collateral_management"
    category: "securities_financing"
    purpose: "The Collateral Management Agent handles the collateral behind financing and derivatives: eligibility, haircuts, margin, and the optimization of what to post."
    path: "agents/securities_financing/collateral_management/"
    inputs:
      - "The exposures requiring collateral and the eligible collateral set."
      - "Eligibility schedules, haircuts, and margin (initial/variation) terms."
      - "Available inventory and its opportunity cost."
      - "Concentration, rehypothecation, and regulatory constraints."
    outputs:
      - "A collateral eligibility and haircut assessment."
      - "An allocation/optimization plan (cheapest-to-deliver, within limits)."
      - "Margin (initial/variation) treatment and call behavior."
      - "Concentration, wrong-way, and rehypothecation risk."
      - "Regulatory (LCR/NSFR, capital) impact of the collateral choices."
  - name: "securities_financing/financing_cost_analysis"
    category: "securities_financing"
    purpose: "The Financing Cost Analysis Agent computes the all-in cost of financing a strategy and makes backtests and live P&L financing-aware."
    path: "agents/securities_financing/financing_cost_analysis/"
    inputs:
      - "The strategy's positions (long, short, financed) and horizon."
      - "Borrow/rebate, repo/funding, and margin data, point-in-time."
      - "The current cost treatment in the backtest or P&L."
      - "Capacity and turnover context."
    outputs:
      - "An all-in cost-of-carry / financing-cost decomposition."
      - "A financing-aware restatement of returns (borrow, rebate, funding, margin)."
      - "A financing-spread and margin-cost quantification."
      - "Capacity implications from expensive or scarce financing."
      - "Findings where a backtest understates financing cost."
  - name: "securities_financing/repo_financing"
    category: "securities_financing"
    purpose: "The Repo Financing Agent handles repurchase and reverse-repurchase agreements: how positions are funded and how cash is deployed against collateral."
    path: "agents/securities_financing/repo_financing/"
    inputs:
      - "The positions to fund or the cash to deploy, and the collateral involved."
      - "Repo/reverse-repo rate data (GC vs specials), point-in-time."
      - "Term (overnight vs term) and tri-party vs bilateral arrangements."
      - "Haircut, counterparty, and roll constraints."
    outputs:
      - "A funding plan (repo/reverse repo) with rate and term rationale."
      - "A repo-rate/funding-curve view, GC vs specials distinguished."
      - "Haircut and collateral treatment."
      - "Roll risk and funding-counterparty exposure."
      - "The funding cost netted into strategy economics."
  - name: "securities_financing/securities_lending"
    category: "securities_financing"
    purpose: "The Securities Lending Agent handles stock loan and borrow: locating and pricing the borrow that a short position requires, and the mechanics that determine its cost and risk — general collateral vs specials, short rebate, recalls, buy-ins, and corporate actions on loaned securities."
    path: "agents/securities_financing/securities_lending/"
    inputs:
      - "The securities to borrow and the intended short size and horizon."
      - "Borrow availability and rate data (GC vs specials), point-in-time."
      - "Rebate/fee structure and any term-vs-open loan terms."
      - "Recall, buy-in, and corporate-action considerations."
    outputs:
      - "A borrow availability and cost assessment (fee, rebate, GC vs specials)."
      - "Recall and buy-in risk characterization."
      - "Corporate-action handling (manufactured dividends, voting) on the loan."
      - "Point-in-time borrow-cost treatment for signals and backtests."
      - "Capacity implications from limited or expensive borrow."
  - name: "sql-integration-agent"
    category: "root"
    purpose: "The SQL Integration Agent connects to SQL databases, inspects schemas, and runs safe analytical queries."
    path: "agents/sql-integration-agent/"
    inputs:
      - "The connection profile (from env/secrets) and target database."
      - "The user's data intent."
      - "Safety constraints (row limits, timeouts, read-only scope)."
    outputs:
      - "Connection verification and catalog/schema summary."
      - "A parameterized query aligned to intent."
      - "A result set with query audit metadata."
      - "Safety notes (limits, guardrails applied)."
    skill_path: "agents/sql-integration-agent/SKILL.md"
    interface:
      inputs:
        - "query_intent"
        - "database_config"
      outputs:
        - "query_results"
        - "schema_summary"
  - name: "tableau-dashboard-agent"
    category: "root"
    purpose: "The Tableau Dashboard Agent generates Tableau dashboard specifications using retrieval-augmented context and strict schema validation."
    path: "agents/tableau-dashboard-agent/"
    inputs:
      - "The dashboard request and the prepared dataset fields."
      - "Dashboard pattern/API references from the knowledge base."
      - "Validation contracts (schema) for the payload."
    outputs:
      - "A structured dashboard payload mapped to data fields."
      - "Schema-validated output (with bounded repair of failures)."
      - "Assumptions made during drafting."
      - "Deployment instructions."
    skill_path: "agents/tableau-dashboard-agent/SKILL.md"
    interface:
      inputs:
        - "semantic_dashboard_request"
        - "prepared_dataset"
        - "dashboard_knowledge_context"
      outputs:
        - "tableau_payload"
        - "validation_status"
  - name: "test_engineering/cpp_test_fuzz_engineer"
    category: "test_engineering"
    purpose: "Writes and reviews C++ unit tests (GoogleTest/Catch2) and fuzz harnesses (libFuzzer/AFL++) for memory-unsafe or parsing/deserialization-heavy code, with sanitizer discipline (ASan/UBSan/MSan/TSan) and crash-triage practice."
    path: "agents/test_engineering/cpp_test_fuzz_engineer/"
    inputs:
      - "The C++ code (function, class, or module) needing tests or fuzzing."
      - "The build system in use (CMake, Bazel, etc.) and existing test/fuzz infrastructure, if any."
      - "Confirmation the target is owned by or authorized for the requester to test — required before any fuzz harness is built."
      - "Any existing crash artifacts needing triage."
    outputs:
      - "GoogleTest/Catch2 unit test code."
      - "A libFuzzer or AFL++ fuzz harness, scoped to one function/boundary, with sanitizer build flags."
      - "A seed corpus suggestion and a crash-triage writeup for any reproduced crash (minimized input, faulting function, defect class)."
      - "Honest notes on what remains untested or unfuzzed."
  - name: "test_engineering/javascript_test_engineer"
    category: "test_engineering"
    purpose: "Writes and reviews JavaScript unit and integration tests (Jest, Vitest, Mocha): mocking and async discipline, DOM/component testing patterns, and coverage that reflects real behavior rather than a chased number."
    path: "agents/test_engineering/javascript_test_engineer/"
    inputs:
      - "The JavaScript code (function, module, or component) needing tests."
      - "The test runner already in use, if any (Jest, Vitest, Mocha, or none yet)."
      - "Any existing tests, mocks, or test setup files."
    outputs:
      - "Test code using the requester's runner (or a recommended one if none is set up)."
      - "Mocking/faking at the correct boundary; async tests that actually await what they claim to."
      - "A flakiness/mocking-discipline/coverage-honesty review of any existing suite."
      - "Honest notes on what remains untested."
  - name: "test_engineering/python_test_engineer"
    category: "test_engineering"
    purpose: "Writes and reviews pytest tests: fixtures, parametrization, mocking discipline, property-based tests (Hypothesis), and coverage that reflects real behavior rather than a chased number."
    path: "agents/test_engineering/python_test_engineer/"
    inputs:
      - "The Python code (or module/package) needing tests."
      - "Any existing tests, fixtures, or `conftest.py`."
      - "Constraints: what's mockable/fakeable, what must run against a real dependency, determinism requirements."
    outputs:
      - "pytest test code: fixtures, parametrized cases, mocks/fakes at the right boundary."
      - "Property-based test suggestions (Hypothesis) where an invariant exists."
      - "A coverage/flakiness/mocking-discipline review of any existing suite."
      - "Honest notes on what remains untested."
  - name: "test_engineering/test_engineering_orchestrator"
    category: "test_engineering"
    purpose: "Routes a testing request to the right language specialist(s) — `python_test_engineer`, `cpp_test_fuzz_engineer`, `javascript_test_engineer`, `typescript_test_engineer` — by detecting the stack involved, and consolidates their output into one handoff to `testing_validation` and/or `quality-guard-agent`."
    path: "agents/test_engineering/test_engineering_orchestrator/"
    inputs:
      - "The code, file paths, or repo section that needs tests."
      - "Any existing test tooling already in use (config files, CI scripts, `package.json`/`pyproject.toml`/`CMakeLists.txt`, etc.)."
      - "The downstream need: AC coverage (→ `testing_validation`), a release decision (→ `quality-guard-agent`), or both."
    outputs:
      - "The language(s) detected and which specialist(s) were routed to."
      - "Each specialist's output, consolidated (not merely concatenated) with overlaps and gaps between languages called out."
      - "A single handoff line naming `testing_validation` and/or `quality-guard-agent`."
  - name: "test_engineering/typescript_test_engineer"
    category: "test_engineering"
    purpose: "Writes and reviews TypeScript tests: the same runtime testing tooling as `javascript_test_engineer` (Jest, Vitest, Mocha) plus type-level testing (tsd, `expect-type`, or `// @ts-expect-error` assertions) and strict-mode discipline, so a type's contract is verified as deliberately as its runtime behavior."
    path: "agents/test_engineering/typescript_test_engineer/"
    inputs:
      - "The TypeScript code (function, module, component, or type definition) needing tests."
      - "The `tsconfig.json` strictness settings in effect."
      - "The test runner already in use, if any."
    outputs:
      - "Runtime test code (as `javascript_test_engineer` produces, TypeScript- aware)."
      - "Type-level tests: cases that should type-check and cases that should be rejected (`// @ts-expect-error`, `tsd`, or `expect-type` assertions)."
      - "A strict-mode compliance note when the codebase isn't running strict mode."
      - "Honest notes on what remains untested, at either the runtime or type level."
  - name: "testing_validation"
    category: "root"
    purpose: "The Testing & Validation Agent covers the fourth stage of the development lifecycle."
    path: "agents/testing_validation/"
    inputs:
      - "Requirements, acceptance criteria, and the implementation."
      - "Existing tests, fixtures, and test data."
      - "Model/backtest outputs and the claims made about them."
      - "Constraints: runtime, data availability, determinism."
    outputs:
      - "Test plan mapped to acceptance criteria."
      - "Unit, integration, regression, and validation test suggestions."
      - "Coverage and gap analysis."
      - "For models: validation scheme review (splits, leakage, significance)."
      - "Pass/fail summary and remaining risks."
  - name: "tooling/excel"
    category: "tooling"
    purpose: "The Excel Agent builds and reviews Excel models and workbooks with quant rigor."
    path: "agents/tooling/excel/"
    inputs:
      - "The workbook (or a description of its sheets, inputs, and outputs)."
      - "Intended purpose and the decision the model supports."
      - "Data sources and how they enter the workbook (manual, Power Query, links)."
      - "Any VBA/macros and external connections."
    outputs:
      - "A structure review: inputs / calculations / outputs separation, named ranges."
      - "A formula audit: precedents/dependents, magic constants, inconsistent rows."
      - "A point-in-time / look-ahead review of time-series layouts."
      - "Reconciliation and error-flag checks."
      - "Reproducibility notes: how inputs are captured and the result regenerated."
      - "A recommendation on what should graduate from Excel into tested code."
  - name: "tooling/looker"
    category: "tooling"
    purpose: "The Looker Dashboard Agent brings the SDK's engineering discipline to Looker."
    path: "agents/tooling/looker/"
    inputs:
      - "A governed `DashboardSpec` / Looker `BiDashboardPayload` (`0018`)."
      - "Governed metric definitions (`0008`) and the dataset/model."
      - "Layout, permissions, and accessibility expectations."
    outputs:
      - "A Looker dashboard payload (tile per panel) via `render_looker`."
      - "A review of chart honesty, metric governance, LookML semantic-model consistency, explores, and PDT/caching, and permissions."
      - "Handoffs to `dashboard_design`, `data_storytelling`, and `reporting-agent`."
  - name: "tooling/power_bi"
    category: "tooling"
    purpose: "The Power BI Agent designs and reviews Power BI datasets and reports: the data model, DAX measures, refresh and lineage, row-level security, and performance."
    path: "agents/tooling/power_bi/"
    inputs:
      - "The dataset/report (or a description of tables, relationships, and measures)."
      - "Data sources and refresh mechanism (gateway, service, incremental)."
      - "Security requirements (who sees what) and governance constraints."
      - "Performance expectations and model size."
    outputs:
      - "A data-model review: star schema, relationships, cardinality, filter direction."
      - "A DAX review: measures vs calculated columns, context correctness, performance."
      - "A refresh and lineage plan, including point-in-time snapshots where relevant."
      - "A row-level security design with credentials in the service, not embedded."
      - "Performance recommendations (model size, aggregations, VertiPaq-friendly design)."
  - name: "tooling/qlik"
    category: "tooling"
    purpose: "The Qlik Dashboard Agent brings the SDK's engineering discipline to Qlik."
    path: "agents/tooling/qlik/"
    inputs:
      - "A governed `DashboardSpec` / Qlik `BiDashboardPayload` (`0018`)."
      - "Governed metric definitions (`0008`) and the dataset/model."
      - "Layout, permissions, and accessibility expectations."
    outputs:
      - "A Qlik dashboard payload (object per panel) via `render_qlik`."
      - "A review of chart honesty, metric governance, the associative data model, set analysis, and section-access security, and permissions."
      - "Handoffs to `dashboard_design`, `data_storytelling`, and `reporting-agent`."
  - name: "tooling/react"
    category: "tooling"
    purpose: "The React Dashboard Agent brings the SDK's engineering discipline to **web dashboards** built in React."
    path: "agents/tooling/react/"
    inputs:
      - "A governed `DashboardSpec` (`0014`/`0015`) whose panels reference governed metrics."
      - "The target chart/component library and accessibility requirements."
      - "Data-source and refresh expectations for the web app."
    outputs:
      - "A React dashboard payload (`render_react`): components (mapped from chart types), props (governed metric, dimensions, title), a grid layout, dataset, page, filters."
      - "A review of chart honesty, accessibility (ARIA, contrast, keyboard), state/data fetching, and metric governance."
      - "Handoffs to the design (`dashboard_design`), storytelling, and reporting agents."
  - name: "tooling/streamlit_dash"
    category: "tooling"
    purpose: "The Streamlit Dashboard Agent brings engineering discipline to Python-native dashboards built in Streamlit."
    path: "agents/tooling/streamlit_dash/"
    inputs:
      - "A governed `DashboardSpec` / Streamlit `BiDashboardPayload` (`0018`)."
      - "Governed metric definitions (`0008`) and the data source / endpoint."
      - "Caching, layout, and accessibility expectations."
    outputs:
      - "A Streamlit app (`app.py`, `requirements.txt`) via `scaffold_streamlit`."
      - "A review of `@st.cache_data` usage, rerun/state correctness, chart honesty, and secrets kept out of the app."
      - "Handoffs to `dashboard_design`, `data_storytelling`, and `reporting-agent`."
  - name: "tooling/superset"
    category: "tooling"
    purpose: "The Superset Dashboard Agent brings the SDK's engineering discipline to Superset."
    path: "agents/tooling/superset/"
    inputs:
      - "A governed `DashboardSpec` / Superset `BiDashboardPayload` (`0018`)."
      - "Governed metric definitions (`0008`) and the dataset/model."
      - "Layout, permissions, and accessibility expectations."
    outputs:
      - "A Superset dashboard payload (chart per panel) via `render_superset`."
      - "A review of chart honesty, metric governance, SQL/dataset governance, Jinja templating safety, and caching, and permissions."
      - "Handoffs to `dashboard_design`, `data_storytelling`, and `reporting-agent`."
  - name: "tooling/tableau"
    category: "tooling"
    purpose: "The Tableau Agent designs and reviews Tableau workbooks and data sources: extract-vs-live choices, calculations (LOD and table calcs), honest visualization, performance, and publishing/permissions."
    path: "agents/tooling/tableau/"
    inputs:
      - "The workbook or a description of its data source, calculations, and views."
      - "Data sources, joins/blends, and refresh mechanism."
      - "Intended audience and the decision the dashboard supports."
      - "Performance expectations and publishing/permission requirements."
    outputs:
      - "A data-source review: extract vs live, joins vs blends, row-level detail."
      - "A calculation review: LOD expressions, table calcs, and correctness."
      - "A visualization review: chart choice and honest encoding."
      - "A performance plan (extracts, aggregation, context filters)."
      - "A publishing and permissions review with credentials handled safely."
  - name: "trading_strategies/carry"
    category: "trading_strategies"
    purpose: "The Carry Agent designs and reviews carry and roll-down strategies across asset classes: FX carry, fixed-income carry and roll-down, commodity carry (backwardation/contango), and dividend/equity carry."
    path: "agents/trading_strategies/carry/"
    inputs:
      - "Asset class and instruments, with their carry/roll definition."
      - "Yield, forward, or futures curve data, point-in-time."
      - "Financing and funding assumptions."
      - "Risk, leverage, and drawdown constraints."
    outputs:
      - "A carry definition and its decomposition (carry vs expected spot move)."
      - "A carry-to-risk assessment and tail/unwind characterization."
      - "Explicit financing, funding, and roll-cost treatment."
      - "Crowding and correlation-to-other-carry review."
      - "Conditioning or hedging options for unwind risk."
  - name: "trading_strategies/event_driven_arbitrage"
    category: "trading_strategies"
    purpose: "The Event-Driven & Arbitrage Agent designs and reviews event-driven strategies: merger/risk arbitrage, index rebalancing, earnings and corporate-action events, convertible arbitrage, and special situations."
    path: "agents/trading_strategies/event_driven_arbitrage/"
    inputs:
      - "The event type and its universe of occurrences."
      - "Point-in-time event announcement and effective dates."
      - "Payoff structure and the position around the event."
      - "Cost, borrow, and capacity constraints."
    outputs:
      - "An event definition with point-in-time announcement/effective dates."
      - "A payoff and deal/event-failure risk characterization."
      - "A sample-size and rare-event assessment (fat tails, few observations)."
      - "Crowding review (many arbs trade the same known events)."
      - "A cost-, borrow-, and capacity-aware view of the net edge."
  - name: "trading_strategies/macro_multi_asset"
    category: "trading_strategies"
    purpose: "The Macro & Multi-Asset Agent designs and reviews macro and allocation strategies: global macro, tactical and strategic asset allocation, risk parity, and cross-asset tilts."
    path: "agents/trading_strategies/macro_multi_asset/"
    inputs:
      - "The strategy, asset menu, and allocation logic."
      - "Macro/economic series with vintage (first-print vs revised) data."
      - "Correlation, volatility, and leverage assumptions."
      - "Risk, leverage, and drawdown constraints."
    outputs:
      - "An allocation/signal specification with its macro rationale."
      - "A point-in-time review of economic data (first-print vs revised)."
      - "A correlation-stability and diversification assessment."
      - "A leverage and drawdown characterization (e.g. risk-parity leverage risk)."
      - "Regime-dependence and stress-behavior review."
  - name: "trading_strategies/market_making_microstructure"
    category: "trading_strategies"
    purpose: "The Market Making & Microstructure Agent designs and reviews liquidity-provision and microstructure strategies: market making, execution alpha, and order-book/short-horizon strategies."
    path: "agents/trading_strategies/market_making_microstructure/"
    inputs:
      - "The strategy and the venue/instrument microstructure."
      - "Tick or order-book data, point-in-time and correctly timestamped."
      - "Latency, queue-position, and fill assumptions."
      - "Inventory, risk, and capital constraints."
    outputs:
      - "A strategy specification with the microstructure edge stated."
      - "An adverse-selection and inventory-risk assessment."
      - "A backtest-realism review (fills, queue position, latency, no same-tick look-ahead)."
      - "Capacity and market-impact characterization."
      - "Infrastructure/latency dependence and failure modes."
  - name: "trading_strategies/mean_reversion_statarb"
    category: "trading_strategies"
    purpose: "The Mean Reversion & Statistical Arbitrage Agent designs and reviews mean-reversion strategies: pairs trading, cointegration-based stat arb, and index/ETF arbitrage."
    path: "agents/trading_strategies/mean_reversion_statarb/"
    inputs:
      - "The candidate universe or pairs, with point-in-time membership."
      - "Price/return history and the spread or relationship definition."
      - "Proposed signal (z-score, cointegration residual) and thresholds."
      - "Cost, borrow, and capacity constraints."
    outputs:
      - "A relationship and stationarity assessment (cointegration, half-life)."
      - "Entry/exit and stop logic with rationale."
      - "A transaction-cost-aware profitability view (costs often dominate)."
      - "Regime-break and relationship-decay risk."
      - "Universe construction and multiple-testing controls."
  - name: "trading_strategies/momentum_trend"
    category: "trading_strategies"
    purpose: "The Momentum & Trend Agent designs and reviews momentum and trend-following strategies: cross-sectional momentum (rank winners vs losers), time-series momentum, and trend-following (CTA-style)."
    path: "agents/trading_strategies/momentum_trend/"
    inputs:
      - "Universe and asset class, with point-in-time membership."
      - "Return history and the intended decision frequency."
      - "Candidate lookback, skip, and holding-period windows."
      - "Cost, turnover, and capacity constraints."
    outputs:
      - "A momentum specification (formation window, skip, holding, ranking scheme)."
      - "Cross-sectional vs time-series recommendation with rationale."
      - "Crash-risk and drawdown characterization."
      - "Turnover, cost, and capacity assessment."
      - "Crowding and factor-overlap review."
  - name: "trading_strategies/value_factor"
    category: "trading_strategies"
    purpose: "The Value & Factor Agent designs and reviews factor strategies: value, quality, size, low-volatility, profitability, and other cross-sectional style factors."
    path: "agents/trading_strategies/value_factor/"
    inputs:
      - "The factor definition(s) and the fundamental/price data behind them."
      - "Universe with point-in-time membership and classifications."
      - "Rebalance frequency and construction (deciles, z-scores, weighting)."
      - "Cost and capacity constraints."
    outputs:
      - "A factor specification with point-in-time construction."
      - "A leakage review of fundamentals (restatement, reporting lag, look-ahead)."
      - "Crowding and decay assessment vs known factors."
      - "Neutralization choices (sector, size, beta) and their rationale."
      - "A cost- and capacity-aware view of the net factor premium."
  - name: "trading_strategies/volatility_options"
    category: "trading_strategies"
    purpose: "The Volatility & Options Agent designs and reviews volatility and options strategies: variance risk premium harvesting, volatility arbitrage (implied vs realized), dispersion, options overlays, and VIX/variance strategies."
    path: "agents/trading_strategies/volatility_options/"
    inputs:
      - "The strategy and instruments (options, variance, VIX products)."
      - "Implied and realized volatility data, point-in-time."
      - "Greeks, hedging frequency, and slippage assumptions."
      - "Risk, margin, and drawdown constraints."
    outputs:
      - "A strategy specification with its volatility edge stated."
      - "A greeks and path-dependence review (delta-hedging, gamma, vega)."
      - "Implied-vs-realized decomposition and the variance risk premium captured."
      - "Tail-risk characterization (short-vol crash exposure) and hedges."
      - "Model-risk review (pricing/vol surface assumptions) and slippage."
  - name: "venture_intelligence/central_asia/regional_lead"
    category: "venture_intelligence"
    purpose: "The Central Asia Venture Regional Lead Agent gives a market-by-market view of venture activity in Kazakhstan, Uzbekistan, Kyrgyzstan, and Tajikistan (Turkmenistan noted as very thin-coverage) and routes work to shared specialists."
    path: "agents/venture_intelligence/central_asia/regional_lead/"
    inputs:
      - "The question, entity list, or signal batch, with period and currency."
      - "Source coverage statements per market, including which sources are Russian- or local-language only."
      - "Outputs from `multilingual_document_nlp` and `entity_resolution` where already run."
    outputs:
      - "A market-by-market breakdown with sample size and coverage per market."
      - "Comparability notes: local currency versus USD, FX date, number format (space thousands separator and decimal comma in Russian-language documents), script variant, and domicile versus operating market."
      - "A routing plan, and open evidence gaps ranked by how much they limit the conclusion."
      - "A list of name pairs that span Cyrillic and Latin script and need a registry identifier before any merge."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/collection_gap_tracker"
    category: "venture_intelligence"
    purpose: "The Collection Gap Tracker Agent turns evidence gaps into a register of information requirements — what question, why it matters to a decision, what lawful public or licensed sources could answer it, and its status — for the accountable human to approve."
    path: "agents/venture_intelligence/collection_gap_tracker/"
    inputs:
      - "The open gaps from the products and agents, and the decision each product supports (stated by the caller)."
      - "The source catalog (`sources/`) and the pack's prohibited source classes."
      - "The previous register, if any."
    outputs:
      - "A register: requirement ID, question, linked decision, gap type, candidate lawful channels, status, and owner."
      - "Prioritisation by the caller's stated decision impact, with the rule shown."
      - "A prohibited-source check on every candidate channel, with any prohibited class refused and noted."
      - "Aging: requirements open longest, and requirements satisfied or closed with the evidence."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/company_diligence"
    category: "venture_intelligence"
    purpose: "The Company Diligence Agent assembles a structured diligence memo from evidence the caller supplies about one company: documents, filings, signals, and structure maps."
    path: "agents/venture_intelligence/company_diligence/"
    inputs:
      - "The company's documents and records supplied by the caller, each with source, date, and language."
      - "Outputs from `multilingual_document_nlp`, `entity_resolution`, the regional structure analysts, and the signal analysts, where already run."
      - "The deal team's diligence checklist, if any."
    outputs:
      - "A memo with the required sections: Evidence, Assumptions, Judgement, Open Gaps, each finding with source grade and confidence."
      - "A claim-versus-evidence table: each company claim, the independent evidence for or against, and the corroboration status."
      - "A red-flag and inconsistency list (e.g. figures that disagree across languages or versions, unresolved ownership layers, undated links)."
      - "A questions-for-the-company and questions-for-counsel list, with jurisdiction-dependent rules marked unverified."
      - "A routing note listing which analysis came from which agent."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/competing_hypotheses_analyst"
    category: "venture_intelligence"
    purpose: "The Competing Hypotheses Analyst Agent builds a transparent matrix of competing hypotheses against the evidence — including a deception or measurement-artifact hypothesis — to show which evidence discriminates between them and how sensitive the result is."
    path: "agents/venture_intelligence/competing_hypotheses_analyst/"
    inputs:
      - "The hypotheses, supplied or proposed for the analyst to accept, including at least one deception-or-artifact hypothesis."
      - "The evidence items with source grades and origins."
      - "The analyst's consistent / inconsistent / neutral ratings, or proposed ratings for the analyst to review."
    outputs:
      - "A matrix of evidence against hypotheses with each rating and its reason."
      - "Inconsistency counts per hypothesis, with diagnostic evidence (items that differ across hypotheses) separated from non-diagnostic evidence."
      - "A sensitivity note: which single piece of evidence, if wrong, would change the ordering."
      - "A red-team list: the strongest case against the favoured hypothesis."
      - "Open gaps: evidence that would discriminate but is missing."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/confidence_language_reviewer"
    category: "venture_intelligence"
    purpose: "The Confidence Language Reviewer Agent reviews the wording of analytic judgements for calibrated likelihood language tied to the standard probability bands, keeps likelihood separate from confidence in the evidence, and flags vague or unsupported wording."
    path: "agents/venture_intelligence/confidence_language_reviewer/"
    inputs:
      - "The draft text with each judgement marked or identifiable."
      - "Any stated probabilities and the evidence-confidence level (low, moderate, high) the analyst intends."
      - "The confidence bands from `knowledge/venture_intelligence/conventions.json`."
    outputs:
      - "A finding per judgement: the stated word, the stated probability if any, the band the probability falls in, and whether they match."
      - "Flagged vague wording with a suggested standard term, offered as a suggestion only."
      - "Judgements that lack a stated confidence in the evidence or a basis, listed as gaps."
      - "A summary showing the distribution of likelihood words across the product."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/deal_sourcing"
    category: "venture_intelligence"
    purpose: "The Deal Sourcing Agent discovers candidate companies from the signal channels and screens them against criteria the caller states, producing a longlist with the evidence and coverage behind each entry."
    path: "agents/venture_intelligence/deal_sourcing/"
    inputs:
      - "The thesis or criteria, stated by the caller."
      - "Signal outputs from the analyst agents, and company records with `known_at` dates."
      - "`entity_resolution` decisions so a company is listed once."
    outputs:
      - "A longlist: each company with its resolved identifier, the signals that surfaced it, source grade and confidence, and which stated criteria it meets."
      - "The screening formula or rule set, stated, and the order produced by it, with the note that order reflects the criteria and not merit."
      - "Coverage: channels, regions, and languages searched, and what the discovery could not see (stealth companies, unpublished filings, uncovered markets)."
      - "A list of excluded candidates and the reason for each exclusion."
      - "Open gaps and suggested additional channels."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/dual_use_indicator"
    category: "venture_intelligence"
    purpose: "The Dual-Use Indicator Agent flags indicators that a technology, product, or research area may be dual-use or subject to export or technology controls, by matching descriptions against control lists the caller supplies, and turns each into a question for counsel."
    path: "agents/venture_intelligence/dual_use_indicator/"
    inputs:
      - "Technology and product descriptions with source and date."
      - "Control lists or category descriptions supplied by the caller, with version and date; none is recalled from memory."
      - "`multilingual_document_nlp` extractions with source spans for non-English descriptions."
    outputs:
      - "Indicators: description text, the control-list entry it resembles, the match basis, confidence, and the list version."
      - "Questions for counsel for each indicator, each marked unverified, including end-use and end-user questions."
      - "Gaps: technical parameters the list depends on that the description does not state."
      - "A coverage note: which lists, versions, and languages were used."
    decision_path_class: "sovereign_adjacent"
  - name: "venture_intelligence/entity_resolution"
    category: "venture_intelligence"
    purpose: "The Entity Resolution Agent compares company records from different sources, scripts, and jurisdictions and reports whether they are the same legal entity, using registry identifiers and LEIs first and names only as candidates — never merging on a name alone."
    path: "agents/venture_intelligence/entity_resolution/"
    inputs:
      - "Records with name, jurisdiction, registry identifier, LEI, and source, each with a known_at date."
      - "The registry and LEI references the caller supplies; none is retrieved from memory."
    outputs:
      - "A decision per pair: match, candidate, candidate_cross_script, needs_registry_id, or no_match, with the reasons."
      - "The normalized comparison form, with the original name and legal-form suffix preserved."
      - "A list of pairs that need a registry identifier or a bilingual human reviewer before any merge."
      - "Per-script and per-language counts of decisions, so quality is not pooled."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/fund_performance_analyst"
    category: "venture_intelligence"
    purpose: "The Fund Performance Analyst Agent computes and explains venture fund performance from dated cash flows: DPI, RVPI, and TVPI as of a date, XIRR with its roots and warnings, the J-curve cash profile and its report-date series, Kaplan-Schoar PME against a supplied index, and the percentile rank among vintage-matched peers the caller supplies."
    path: "agents/venture_intelligence/fund_performance_analyst/"
    inputs:
      - "Dated contributions, distributions, and reported NAV, each with a known_at date and a stated basis (gross or net of fees and carry)."
      - "Index levels for PME and a vintage-matched peer set supplied by the caller, with the peer set's source and composition."
      - "The report dates and the as-of date."
    outputs:
      - "Multiples as of the date with paid-in, distributions, NAV, NAV date, and a stale-NAV warning when the caller supplies an age limit."
      - "XIRR (Actual/365) with every root found and a warning when the signs change more than once."
      - "The J-curve cash profile (trough, breakeven date or none) and a report-date series, each row using only information known by that date."
      - "KS-PME with the future values behind it; peer percentile rank and quartile with the number of peers and the benchmark caveat."
      - "A basis statement for every figure: gross or net, which NAV, which index, which peer set."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/greater_china_east_asia/entity_structure_analyst"
    category: "venture_intelligence"
    purpose: "The Greater China Entity Structure Analyst Agent maps how companies operating in Greater China are legally and financially structured from public filings and registries — offshore holding companies, Hong Kong intermediate holdings, onshore operating entities, any disclosed contractual-control arrangements such as variable interest entity (VIE) structures, and disclosed state-linked or guidance-fund shareholders — and flags where the structure obscures ownership or control."
    path: "agents/venture_intelligence/greater_china_east_asia/entity_structure_analyst/"
    inputs:
      - "Registry extracts and filings supplied by the caller (including native-language filings from the Mainland, Hong Kong, and Taiwan registers and exchange prospectuses) — never fabricated from memory."
      - "`multilingual_document_nlp` extractions with source spans, and `entity_resolution` decisions."
      - "The adopter's jurisdiction-rule notes from counsel."
    outputs:
      - "A structure map: entity, jurisdiction, legal form, role (offshore holdco / intermediate / onshore operating / contractual-control entity), ownership and control links with percentage, mechanism (equity or contract), as-…"
      - "Indicators, each with confidence and source: contractual rather than equity control, layered offshore holdings, disclosed state-linked or guidance-fund holders, nominee or trust holders, and unresolved layers."
      - "Questions for counsel about foreign-investment restrictions, outbound-investment rules, and data or export-control exposure, each marked unverified."
      - "Items that could not be resolved, with the registry or document that would resolve them."
    decision_path_class: "sovereign_adjacent"
  - name: "venture_intelligence/greater_china_east_asia/regional_lead"
    category: "venture_intelligence"
    purpose: "The Greater China and East Asia Venture Regional Lead Agent gives a market-by-market view of venture activity in Mainland China, Hong Kong SAR, Taiwan, Japan, and South Korea (Macau and Mongolia noted as thin-coverage) and routes work to specialists."
    path: "agents/venture_intelligence/greater_china_east_asia/regional_lead/"
    inputs:
      - "The question, entity list, or signal batch, with period and currency."
      - "Source coverage statements per market, including which sources are native-language only."
      - "Outputs from `multilingual_document_nlp`, `entity_resolution`, and the regional specialist when already run."
    outputs:
      - "A market-by-market breakdown with sample size and coverage stated per market."
      - "Comparability notes: currency and onshore/offshore distinction, accounting basis, fiscal year-end, stage naming, and source language per market."
      - "A routing plan naming which specialist or shared agent handles each part, and what the data cannot answer."
      - "Open evidence gaps ranked by how much they limit the conclusion."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/hiring_signal_analyst"
    category: "venture_intelligence"
    purpose: "The Hiring Signal Analyst Agent reads hiring and workforce signals at the organization level — posting volumes, role mix, skill demand, and geography by company or sector — as a lead indicator of growth, pivots, or contraction, without profiling any individual."
    path: "agents/venture_intelligence/hiring_signal_analyst/"
    inputs:
      - "Posting or workforce aggregates supplied by the caller or a governed licensed source, each with posting date, company identifier, role category, location (organization level), and source."
      - "Role and skill taxonomies the caller supplies; `entity_resolution` decisions for employer names."
      - "Source coverage and deduplication notes."
    outputs:
      - "Posting volume, role-mix, and geography trends by company or sector, deduplicated, with the dedup rule stated."
      - "Each record's `known_at` set to the posting date, flagged `late_retrieval` where the vendor restates history."
      - "Signal statements with source grade, confidence, and the channel's biases (posting is not hiring, panel bias, language and region coverage)."
      - "Deception checks: duplicate or evergreen postings, sudden uniform mass postings."
      - "Open gaps: markets and languages the panel does not cover."
    decision_path_class: "person_adjacent"
  - name: "venture_intelligence/intelligence_brief_writer"
    category: "venture_intelligence"
    purpose: "The Intelligence Brief Writer Agent drafts a bottom-line-up-front intelligence brief from cited, graded passages retrieved under the caller's clearance: a short BLUF, then evidence, assumptions, judgements, and open gaps kept in separate sections, with calibrated likelihood wording and an evidence-confidence level on every judgement."
    path: "agents/venture_intelligence/intelligence_brief_writer/"
    inputs:
      - "Retrieval results (cited passages) obtained with the caller's clearance and an as-of date; no fact is taken from memory."
      - "The outputs of the signal, tradecraft, and regional agents the brief draws on, each with its source grade and confidence."
      - "The product's classification, audience, and as-of date."
    outputs:
      - "A draft product in the product model: BLUF (at most 600 characters), evidence items each with citations and a source grade, assumptions each with a basis, judgements each with a likelihood word, a probability, an eviden…"
      - "The validation result from `validate_product` and the rendered Markdown, which carries a DRAFT banner until a reviewer is named."
      - "A list of the sources cited with their known-at dates, grades, and access levels."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/investment_memo_writer"
    category: "venture_intelligence"
    purpose: "The Investment Memo Writer Agent drafts an investment memo for the investment committee from approved diligence, tradecraft, and fund outputs and cited passages: evidence, assumptions, judgements, and open gaps in separate sections, with the decision owner named."
    path: "agents/venture_intelligence/investment_memo_writer/"
    inputs:
      - "The `company_diligence` memo, tradecraft outputs (grades, corroboration, competing hypotheses), and fund analytics, each with its basis and confidence."
      - "Retrieval results (cited passages) obtained with the caller's clearance and an as-of date."
      - "The memo's classification and the named decision owner (the investment committee)."
    outputs:
      - "A draft memo in the product model with the decision owner named, evidence items each cited and graded, assumptions with their basis, judgements with calibrated likelihood and evidence confidence, and open gaps."
      - "The validation result and the rendered Markdown with a DRAFT banner until a reviewer is named."
      - "A list of the open gaps and questions for counsel carried through from the diligence work."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/multilingual_document_nlp"
    category: "venture_intelligence"
    purpose: "The Multilingual Document NLP Agent extracts structured, source-anchored facts from start-up financial and legal documents written in Mandarin (Simplified and Traditional), Japanese, Korean, Bahasa Indonesia/Malay, Vietnamese, Thai, Filipino, and English (including South Asian business English with lakh and crore), and normalizes them so figures and parties are comparable across languages and jurisdictions."
    path: "agents/venture_intelligence/multilingual_document_nlp/"
    inputs:
      - "The document (or governed corpus under spec `0071`) with its language, script, and origin recorded."
      - "The extraction schema requested (parties, round terms, financials, ownership, covenants, risk factors)."
      - "Reference tables the caller supplies: entity registry IDs, FX rates with dates, accounting-standard notes."
    outputs:
      - "Each extracted field with its **verbatim source-language span**, location, and a confidence level; translation is a separate, labelled field, never a replacement."
      - "Normalized values with the rule applied stated beside each (e.g. 万 = 10^4, 亿 = 10^8; Thai Buddhist year − 543; ROC year + 1911; thousands/decimal separators by locale; currency and fiscal-year-end)."
      - "Entity candidates keyed by registry ID where supplied; transliteration variants listed as candidates, not merged."
      - "A bilingual-conflict list when two language versions diverge, stating which version the document says governs."
      - "A low-resource / low-confidence flag per field and a list of items requiring a bilingual human reviewer."
      - "Where a model run is supplied: a per-language baseline-versus-model agreement report listing agreements, disagreements, model-only and baseline-only items."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/narrative_news_analyst"
    category: "venture_intelligence"
    purpose: "The Narrative and News Analyst Agent turns multilingual news and narrative data into signals about companies, technologies, and sectors — separating original reporting from syndication and promotion, and events from sentiment — while keeping provenance and source grade attached to every item."
    path: "agents/venture_intelligence/narrative_news_analyst/"
    inputs:
      - "Articles or event records supplied by the caller or a governed source (`sources/gdelt.yml` and licensed news), each with publication time, outlet, language, and URL or ID."
      - "`multilingual_document_nlp` extractions with source spans, and `entity_resolution` decisions for named companies."
      - "Outlet information the caller supplies (ownership or affiliation as disclosed by the outlet itself)."
    outputs:
      - "A timeline of original reports with duplicates and syndication collapsed, the collapse rule stated, and each item graded for source reliability and information credibility."
      - "Event signals separated from sentiment signals, each with `known_at` set to publication time."
      - "Indicators of amplification or coordination (burst timing, identical text across outlets, shared sources), each with confidence and the evidence, never an attribution."
      - "Coverage by language and region, and the share of items machine-translated."
      - "Open gaps: languages and regions not covered, unverifiable claims."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/ownership_screen"
    category: "venture_intelligence"
    purpose: "The Ownership Screen Agent assembles ownership and foreign-capital indicators for a company from structure maps, registry facts, and restricted-party list matches, computes effective ownership through chains, and reports indicators with confidence and unresolved layers."
    path: "agents/venture_intelligence/ownership_screen/"
    inputs:
      - "Structure maps with each link's percentage, mechanism (equity or contract), as-of date, source span, and source."
      - "List-match results supplied by the caller (names, list, snapshot date) and `entity_resolution` decisions."
      - "Thresholds supplied by the caller from counsel; the agent does not assert thresholds."
    outputs:
      - "Effective ownership per ultimate holder computed along all paths (products along each path, summed across paths), with the paths shown and the as-of dates."
      - "Indicators with confidence and source grade: foreign-capital share, state-linked holders as disclosed, nominee or trust holders, layered jurisdictions, unresolved layers."
      - "List matches presented as indicators with transliteration and false-positive notes and the snapshot date."
      - "Threshold crossings against the caller's thresholds, labelled as the caller's."
      - "Questions for counsel and open gaps."
    decision_path_class: "sovereign_adjacent"
  - name: "venture_intelligence/patent_ip_analyst"
    category: "venture_intelligence"
    purpose: "The Patent and IP Analyst Agent turns patent and intellectual-property records into landscape signals for technology scouting: filing and publication trends by technology domain and assignee, patent families rather than raw filings, and cross-office coverage including the Chinese, Japanese, Korean, European, US, and international (WIPO) offices."
    path: "agents/venture_intelligence/patent_ip_analyst/"
    inputs:
      - "Patent records supplied by the caller or a governed source (`sources/patentsview.yml` and equivalents), each with office, application number, filing date, publication date, assignee, classification, and family ID where…"
      - "`entity_resolution` decisions for assignees and `multilingual_document_nlp` extractions for non-English text."
      - "The technology-domain definition to scope the landscape."
    outputs:
      - "Counts by patent family, not raw filings, by domain, assignee, office, and publication year, with the family-grouping rule stated."
      - "Each record's `known_at` set to publication or grant date, never the filing date."
      - "A landscape table with coverage by office and language, and the share of assignees resolved to a registry identifier."
      - "Signal statements with source grade, confidence, and the channel's known biases (large-filer bias, defensive filing, publication lag)."
      - "Open gaps: unpublished applications, unresolved assignees, offices not covered."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/portfolio_reserve_analyst"
    category: "venture_intelligence"
    purpose: "The Portfolio Reserve Analyst Agent runs seeded simulations of venture fund outcomes and follow-on reserve policy — heavy-tailed company outcomes, a bootstrap from a supplied cohort, an equal-outcome null, tail sensitivity, and a reserve-fraction table — and reports distributions with intervals and every assumption."
    path: "agents/venture_intelligence/portfolio_reserve_analyst/"
    inputs:
      - "The number of companies, loss probability, tail parameters (alpha, minimum, cap), check size, trials, and seed."
      - "For reserves: reserve fraction(s), follow-on size, the assumed hit rate and false-positive rate, the breakout multiple, and the follow-on dilution."
      - "A cohort of company multiples with its source and selection, for the bootstrap."
    outputs:
      - "Distributions: mean with Monte Carlo standard error, the 5th, 25th, 50th, 75th, and 95th percentiles, and the probability of a multiple below 1."
      - "Concentration: the share of proceeds from the largest company."
      - "A reserve table across fractions on common outcomes with deployed share and follow-on counts."
      - "Tail sensitivity across alpha values, and the bootstrap's share of trials below the equal-outcome null with a small-sample warning below 30 companies."
      - "An assumption ledger on every result (parameters, seed, gross not net, equal checks)."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/source_reliability_grader"
    category: "venture_intelligence"
    purpose: "The Source Reliability Grader Agent proposes a source-reliability grade (A to F) and an information-credibility grade (1 to 6), graded separately, for each source and item in an analytic product, with the basis for each grade stated."
    path: "agents/venture_intelligence/source_reliability_grader/"
    inputs:
      - "Source descriptions, track-record notes, and provenance supplied by the caller."
      - "The items to grade, each with origin identifier, channel, language, and whether it is machine-derived or translated."
      - "Existing grades and their stated bases, if any."
    outputs:
      - "A proposed grade per source and per item (letter then digit, e.g. B2) with the stated basis and the evidence used."
      - "`F` or `6` (cannot be judged) wherever there is no stated basis, never a default."
      - "An origin map: which items share an origin (syndication, republication) and the count of independent origins."
      - "A corroboration status per claim: single-channel, echo, or corroborated across independent channels."
      - "A change log when a grade moves, with the new evidence."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/south_asia/regional_lead"
    category: "venture_intelligence"
    purpose: "The South Asia Venture Regional Lead Agent gives a market-by-market view of venture activity in India, Bangladesh, Pakistan, and Sri Lanka (Nepal, Bhutan, and the Maldives noted as thin-coverage) and routes work to shared specialists."
    path: "agents/venture_intelligence/south_asia/regional_lead/"
    inputs:
      - "The question, entity list, or signal batch, with period and currency."
      - "Source coverage statements per market."
      - "Outputs from `multilingual_document_nlp`, `entity_resolution`, and any funding analysis already run."
    outputs:
      - "A market-by-market breakdown with sample size and coverage per market."
      - "Comparability notes: currency, lakh and crore normalization, fiscal year-end, stage naming, and company domicile versus operating market."
      - "A routing plan, and open evidence gaps ranked by how much they limit the conclusion."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/southeast_asia/entity_structure_analyst"
    category: "venture_intelligence"
    purpose: "The Southeast Asia Entity Structure Analyst Agent maps how Southeast Asian start-ups are legally and financially structured — holding companies, operating subsidiaries, nominee and local-partner arrangements, and ultimate ownership — from public registry and filing facts, and flags where the structure obscures who owns or controls the business."
    path: "agents/venture_intelligence/southeast_asia/entity_structure_analyst/"
    inputs:
      - "Registry extracts and public filings supplied by the caller (e.g. Singapore ACRA, Malaysia SSM, Indonesia AHU/OSS, Vietnam business registry, Thailand DBD, Philippines SEC) — never fabricated from memory."
      - "`multilingual_document_nlp` output for non-English filings."
      - "The adopter's jurisdiction-rule notes supplied by counsel."
    outputs:
      - "A structure map: entity, jurisdiction, legal form, role (holdco / operating / SPV), ownership links with percentage and as-of date."
      - "Indicators, each with confidence and source: foreign-ownership concentration, nominee or trust holders, circular or opaque layers, jurisdiction hops, and capital-source indicators."
      - "A list of facts that must be verified by counsel because they depend on a jurisdiction's current rules (stated as questions, never as conclusions)."
      - "Items that could not be resolved, with the registry or document that would resolve them."
    decision_path_class: "sovereign_adjacent"
  - name: "venture_intelligence/southeast_asia/funding_ecosystem_analyst"
    category: "venture_intelligence"
    purpose: "The Southeast Asia Funding Ecosystem Analyst Agent reviews who is funding Southeast Asian start-ups and on what terms — venture funds, corporate and strategic investors, government and sovereign-linked programs, venture debt — and the exit routes available, putting rounds on a comparable footing across markets, currencies, and instruments."
    path: "agents/venture_intelligence/southeast_asia/funding_ecosystem_analyst/"
    inputs:
      - "Round records with announced / closed / filed dates, currency, instrument, and source, supplied by the caller or a governed source."
      - "Investor and fund lists from the adopter's databases, with the database's backfill and coverage statement."
      - "`multilingual_document_nlp` extractions of terms from non-English documents."
    outputs:
      - "Rounds normalized to a comparable basis: pre/post-money stated, instrument type, currency and FX date, and a flag for undisclosed amounts or valuations."
      - "Syndicate and investor-type summary (funds, corporate, government-linked) from disclosed facts only."
      - "Trend views with sample sizes, survivorship and reporting-lag caveats (per `instructions/point_in_time.md`)."
      - "An exit-route table for the sector with the evidence behind each route."
      - "Unknowns: undisclosed terms, rounds known only from press, and sources that conflict."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/southeast_asia/regional_lead"
    category: "venture_intelligence"
    purpose: "The Southeast Asia Venture Regional Lead Agent gives a market-by-market view of Southeast Asian venture activity and routes work to the region's specialists."
    path: "agents/venture_intelligence/southeast_asia/regional_lead/"
    inputs:
      - "The question, entity list, or signal batch, with period and currency."
      - "Source coverage statements per market (what the adopter's databases and registries actually cover)."
      - "Outputs from the regional specialists and `multilingual_document_nlp`, when already run."
    outputs:
      - "A market-by-market breakdown with sample size and coverage stated per market."
      - "Comparability notes: local currency vs USD, stage naming differences, regulatory regime per market, language of source material."
      - "A routing plan naming which specialist handles which part, and which questions the data cannot answer."
      - "Open evidence gaps ranked by how much they limit the conclusion."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/technology_landscape_analyst"
    category: "venture_intelligence"
    purpose: "The Technology Landscape Analyst Agent maps a technology domain across patents, publications, open-source activity, grants and procurement, and hiring signals into a landscape: who works on what, where, and how fast the activity is growing, with the coverage and bias of each channel stated and readiness reported only as sources state it."
    path: "agents/venture_intelligence/technology_landscape_analyst/"
    inputs:
      - "The technology-domain definition and a classification tree, supplied by the caller."
      - "Outputs from `patent_ip_analyst`, `hiring_signal_analyst`, `narrative_news_analyst`, and source records for publications, code activity, and awards."
      - "`entity_resolution` decisions so organizations are counted once."
    outputs:
      - "A landscape: organizations, regions, and growth by channel, each organization resolved to an identifier or marked unresolved."
      - "Corroboration status per finding: the number of independent channels supporting it, and which channels disagree."
      - "Readiness statements quoted from sources with their scale (e.g. a stated technology readiness level), never asserted as the agent's own."
      - "Emergence indicators with lead time, false-positive notes, and the channel biases (hype terms, publication lag, large-filer bias)."
      - "Coverage by region, language, and channel, and open gaps."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/valuation_marks_reviewer"
    category: "venture_intelligence"
    purpose: "The Valuation Marks Reviewer Agent reviews private-company valuation marks for internal consistency and returns flags with the numbers behind them — a missing basis, a stale mark, a mark-up with no new round, a mark that predates the latest round, a down round not reflected, or a price far from the last round."
    path: "agents/venture_intelligence/valuation_marks_reviewer/"
    inputs:
      - "Holdings with mark date, fair value, shares, valuation basis, prior mark value and date, and the last round's date and price per share."
      - "The thresholds from the firm's valuation policy: maximum mark age and the price tolerance; none is invented here."
      - "The as-of date."
    outputs:
      - "A flag per issue with a code, the holding, and the numbers (age, implied price, last round price, deviation, tolerance)."
      - "A statement of the thresholds used and who supplied them."
      - "Holdings with no flags, listed so a clean result is visible."
      - "The decision owner on every flag (the valuation committee)."
    decision_path_class: "analytic_support"
  - name: "venture_intelligence/venture_orchestrator"
    category: "venture_intelligence"
    purpose: "The Venture Orchestrator Agent routes a plain-language venture or non-traditional-intelligence request to the right chain of agents, with the review gates, decision owner, decision-path class, and clearance the work needs, or refuses the parts of a request the suite must never perform and names the human who owns that decision."
    path: "agents/venture_intelligence/venture_orchestrator/"
    inputs:
      - "The request text, the caller's clearance, and the pack's routing rules (`knowledge/venture_intelligence/routing.json`)."
      - "The coverage matrix of built agents and their decision-path classes."
    outputs:
      - "A plan: status (planned, refused, needs_clarification, or denied), the task kind, the ordered steps (agent, path, class), the decision-path class (the strictest among the steps), the required clearance, the review gates…"
      - "Refusals, each with the refusal text, the human who owns that decision, and the allowed alternatives; a legitimate part of a mixed request is still planned."
      - "Notes: regions with no agent yet, steps skipped because they cover another region, and gaps such as a region with no structure analyst."
      - "`needs_clarification` with the candidate task kinds when the request fits several equally or none."
    decision_path_class: "analytic_support"
  - name: "workflow_orchestrator"
    category: "root"
    purpose: "The Workflow Orchestrator Agent drives a change through the full spec-driven lifecycle."
    path: "agents/workflow_orchestrator/"
    inputs:
      - "The request, hypothesis, or problem statement."
      - "The current state of any existing spec (`specs/NNNN-slug/`)."
      - "Which stage the work is in, if it is already underway."
      - "Constraints and the intended decision."
    outputs:
      - "The current lifecycle position and the next gate to clear."
      - "A routing decision: which stage agent to invoke next and with what inputs."
      - "A gate assessment: what is satisfied, what is missing, what blocks advancement."
      - "An updated spec chain status (`spec.md` / `plan.md` / `tasks.md`)."
      - "A handoff package for the next agent."
