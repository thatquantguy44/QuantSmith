name: Release Notify

# Tells downstream repositories that a new QuantSmith version exists, so a
# consumer can open a bump PR
# and run its own contract tests against it.
#
# This NOTIFIES ONLY. It never opens or merges anything itself: auto-updating
# the contract a shipped client is built on is the failure mode spec 0047
# exists to prevent.
#
# Configuration (both optional -- absent means this workflow does nothing):
#   vars.DOWNSTREAM_REPOS            comma-separated "owner/repo" list
#   secrets.DOWNSTREAM_DISPATCH_TOKEN  a token with repository_dispatch scope
#                                      on those repositories
# No token is ever embedded here; see spec 0047 RISK-003.

on:
  push:
    tags:
      - "v*"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          REPOS: ${{ vars.DOWNSTREAM_REPOS }}
          TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
        run: |
          if [ -z "$REPOS" ] || [ -z "$TOKEN" ]; then
            echo "No downstream repositories or dispatch token configured; nothing to notify."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch release event
        if: steps.cfg.outputs.configured == 'true'
        env:
          REPOS: ${{ vars.DOWNSTREAM_REPOS }}
          TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "$REPOS" | tr ',' '\n' | while read -r repo; do
            repo=$(echo "$repo" | tr -d '[:space:]')
            [ -n "$repo" ] || continue
            echo "Notifying $repo of $VERSION"
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/dispatches" \
              -d "{\"event_type\":\"quantsmith-release\",\"client_payload\":{\"version\":\"$VERSION\"}}")
            if [ "$code" != "204" ]; then
              echo "::warning::dispatch to $repo returned HTTP $code"
              cat /tmp/resp.txt || true
            fi
          done
