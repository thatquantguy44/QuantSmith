name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate required SDK docs
        run: |
          test -s README.md
          test -s agentic_dictionary.md
          test -s docs/sdk_plan.md
          test -s docs/handoff.md
      - name: Validate public agent contracts
        run: |
          # A public agent is any directory containing prompt.md, at any depth
          # under agents/ (allows category folders like agents/data_ingestion/).
          for agent in $(find agents -type f -name prompt.md -exec dirname {} \; | sort -u); do
            test -s "$agent/README.md"
            test -s "$agent/prompt.md"
            test -s "$agent/instructions.md"
            test -s "$agent/tasks.md"
          done
      - name: Validate shell scripts
        run: |
          sh -n setup-hooks.sh
          for hook in .githooks/*; do sh -n "$hook"; done
          for hook in hooks/stages/*.sh; do sh -n "$hook"; done
      - name: Enforce spec-driven traceability
        run: |
          QF_STAGE_ENFORCE=1 sh hooks/stages/run-stage.sh spec
      - name: Enforce backtest integrity (only when a report exists)
        run: |
          QF_STAGE_ENFORCE=1 sh hooks/stages/run-stage.sh backtest
      - name: Enforce pipeline contract (only when a manifest exists)
        run: |
          QF_STAGE_ENFORCE=1 sh hooks/stages/run-stage.sh pipeline-contract
      - name: Enforce alert & monitoring contracts (only when artifacts exist)
        run: |
          QF_STAGE_ENFORCE=1 sh hooks/stages/run-stage.sh alert-contract monitoring-coverage
      - name: Enforce data provenance (only when a disclosure artifact exists)
        run: |
          QF_STAGE_ENFORCE=1 sh hooks/stages/run-stage.sh data-provenance
      - name: Leakage smell scan (advisory)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          QF_DIFF_BASE="$BASE" sh hooks/stages/run-stage.sh leakage
      - name: Enforce secret scan
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          QF_STAGE_ENFORCE=1 QF_DIFF_BASE="$BASE" sh hooks/stages/run-stage.sh secret-scan
      - name: Enforce commit authorship (no AI agent as author or co-author)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then RANGE="$BASE..HEAD"; else RANGE="HEAD~1..HEAD"; fi
          QF_STAGE_ENFORCE=1 QF_ATTRIB_RANGE="$RANGE" \
            sh hooks/stages/run-stage.sh agent-attribution
      - name: Enforce role-context safety (role_context.yml must never be tracked)
        run: |
          QF_STAGE_ENFORCE=1 sh hooks/stages/run-stage.sh role-context
      - name: Enforce model-plugin safety (model_plugins.yml must never be tracked)
        run: |
          QF_STAGE_ENFORCE=1 sh hooks/stages/run-stage.sh model-plugin
      - name: Enforce docs links, agent catalog, spec index, README sync, documented counts, handoff roadmap sync, and ownership
        run: |
          QF_STAGE_ENFORCE=1 sh hooks/stages/run-stage.sh docs-link agent-catalog spec-index readme-sync doc-counts handoff-sync ownership
      - name: Enforce source catalog (fields, index sync, credential-pointer safety)
        run: |
          QF_STAGE_ENFORCE=1 sh hooks/stages/run-stage.sh source-catalog

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package with declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data,quant]"
      - name: Run test suite
        run: |
          python -m pytest tests/ -q
