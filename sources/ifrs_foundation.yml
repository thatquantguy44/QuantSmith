source_id: "ifrs_foundation"
name: "IFRS Foundation — IFRS 9 Financial Instruments"
type: document
owner: "credit-risk"
description: >
  Public IFRS Foundation material for IFRS 9 impairment, registered by spec
  0072 as the authority for expected-credit-loss staging, twelve-month versus
  lifetime measurement, and effective-interest discounting concepts.
  Locator-only: standard text is licensed and is never reproduced in this
  repository.

domain: ["credit_risk", "accounting", "expected_credit_loss"]
access_level: public

quality:
  completeness: medium
  timeliness: "standard and amendments are dated; jurisdictional endorsement can lag issuance"
  known_issues:
    - "standard text is licensed; only public summaries, project pages, and locators may be stored"
    - "IFRS 9 staging is not CECL; the lifetime concept differs and the two must not share a convention record"
    - "endorsement status varies by jurisdiction, so applicability is not implied by issuance"
  last_assessed: "2026-09-09"

point_in_time:
  supports_asof: true
  revision_policy: "amendments carry issuance and effective dates; a historical measurement resolves the version endorsed in the relevant jurisdiction for that period"

connection:
  method: manual_download
  endpoint_or_host: "https://www.ifrs.org"
  credential_ref: "not_required_public_access"

documentation_uri: "https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/"
status: evaluating

data_contract_refs: ["specs/0072-credit-risk-domain-foundation/"]
