source_id: "openalex"
name: "OpenAlex (scholarly works, authors, institutions)"
type: api
owner: "quant-research"
description: >
  Open index of scholarly works, institutions, concepts, and citations for technology-emergence signals. Venture and intelligence source (spec 0088); endpoints, terms, and
  coverage are unverified until confirmed against current documentation.

domain: ["publications", "technology_scouting"]
access_level: public

quality:
  completeness: medium
  timeliness: "continuous updates; records are revised and merged"
  known_issues:
    - "author and institution disambiguation errors"
    - "records are merged or re-IDed over time"
    - "preprint and published versions differ"
  last_assessed: "2026-10-02"

point_in_time:
  supports_asof: true
  known_at_policy: "published"
  revision_policy: "record source file or endpoint, public timestamp when available, and retrieval timestamp; retain dated snapshots where the source keeps no history"

connection:
  method: rest_api
  endpoint_or_host: "https://api.openalex.org"
  credential_ref: "not_required_public_access"

documentation_uri: "https://docs.openalex.org/"
status: evaluating

data_contract_refs: ["specs/0088-venture-sources-pit-ingestion/"]
